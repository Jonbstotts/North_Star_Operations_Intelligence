name: Harden Startup Presentation

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-harden-startup-presentation.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install startup architecture guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('build.sh')
          text=path.read_text()

          old='''if [ ! -f src/com/wtm/ui/StartupExperienceManager.java ] || ! grep -Fq 'peekStartupExperience' src/com/wtm/config/ConfigService.java; then
            echo "ERROR: canonical optional startup-experience ownership is missing." >&2
            exit 1
          fi
          '''
          new='''if [ ! -f src/com/wtm/ui/StartupExperienceManager.java ] || \\
             [ ! -f src/com/wtm/ui/StartupPresentationLayout.java ] || \\
             [ ! -f src/com/wtm/ui/StartupLoginDialog.java ] || \\
             [ ! -f src/com/wtm/ui/LoginFormPanel.java ] || \\
             ! grep -Fq 'peekStartupExperience' src/com/wtm/config/ConfigService.java || \\
             ! grep -Fq 'StartupLoginDialog.authenticate' src/com/wtm/app/Main.java; then
            echo "ERROR: canonical startup presentation/login ownership is missing." >&2
            exit 1
          fi
          if grep -Fq 'SwingUtilities.invokeAndWait' src/com/wtm/ui/StartupExperienceManager.java || \\
             grep -Fq '33_333_333' src/com/wtm/ui/StartupExperienceManager.java || \\
             ! grep -Fq 'getNativeFrameWithMetadata' src/com/wtm/ui/StartupExperienceManager.java || \\
             ! grep -Fq 'ArrayBlockingQueue' src/com/wtm/ui/StartupExperienceManager.java; then
            echo "ERROR: blocking/fixed-rate startup video playback regression detected." >&2
            exit 1
          fi
          '''
          if old not in text:
              raise SystemExit('startup build guard target not found')
          text=text.replace(old,new,1)

          old_compile='''  ci/TickerGeometrySmokeTest.java \\
            ci/BasemapProviderSmokeTest.java
          '''
          new_compile='''  ci/TickerGeometrySmokeTest.java \\
            ci/BasemapProviderSmokeTest.java \\
            ci/StartupPresentationLayoutSmokeTest.java
          '''
          if old_compile not in text:
              raise SystemExit('foundation smoke compile target not found')
          text=text.replace(old_compile,new_compile,1)

          old_run="java -Djava.awt.headless=true -cp '/tmp/ns-foundation-smoke:out:lib/*' BasemapProviderSmokeTest\n"
          new_run=old_run+"java -Djava.awt.headless=true -cp '/tmp/ns-foundation-smoke:out:lib/*' StartupPresentationLayoutSmokeTest\n"
          if old_run not in text:
              raise SystemExit('foundation smoke run target not found')
          text=text.replace(old_run,new_run,1)
          path.write_text(text)
          PY
          git diff --check

      - name: Build canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit hardened build gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.sh
          git diff --cached --check
          git commit -m 'Gate releases on smooth startup presentation architecture'
          git push origin HEAD:master
