name: One-shot remaining shim audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-remaining-shim-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inspect remaining shim-like source
        run: |
          set -euo pipefail
          echo '=== Guard Runtime Coordinator Stabilizer source files ==='
          find src -type f -name '*.java' | grep -E '(Guard|Runtime|Coordinator|Stabilizer|Bootstrap|Compatibility)' | sort || true
          echo '=== Dynamic class lookup or class-name matching ==='
          grep -R -n --include='*.java' 'Class\.forName\|getClass()\.getName\|getClass().getSimpleName\|\.getName().contains' src || true
          echo '=== GlassSurfacePanel definition and uses ==='
          grep -R -n -B 5 -A 12 --include='*.java' 'GlassSurfacePanel' src || true
          echo '=== Sidebar route property ownership ==='
          grep -R -n -B 5 -A 8 --include='*.java' 'northstar.sidebar.route\|createSidebarButton' src/com/wtm/ui src/com/wtm/modular src/com/wtm/app || true
          echo '=== deprecated and compatibility wording ==='
          grep -R -n -i --include='*.java' 'deprecated\|compatib\|legacy.*runtime\|runtime.*legacy\|workaround\|temporary shim\|fallback hook' src || true
