name: One-shot remaining shim audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-remaining-shim-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inspect DataPath presentation owner
        run: |
          set -euo pipefail
          echo '=== Exact GMAIL DATAPATH UI matches ==='
          grep -R -n -B 80 -A 140 --include='*.java' 'GMAIL DATAPATH' src/com/wtm/ui || true
          echo '=== Data Collection UI matches ==='
          grep -R -n -B 40 -A 120 --include='*.java' 'Data Collection' src/com/wtm/ui | head -n 500 || true
