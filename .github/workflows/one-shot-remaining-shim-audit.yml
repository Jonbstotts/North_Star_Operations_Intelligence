name: One-shot remaining shim audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-remaining-shim-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inspect Gmail DataPath call sites
        run: |
          set -euo pipefail
          echo '=== GmailDataPathService call sites ==='
          grep -R -n -B 60 -A 140 --include='*.java' 'GmailDataPathService' src | head -n 700 || true
          echo '=== Gmail labels/buttons ==='
          grep -R -n -B 30 -A 80 --include='*.java' 'Gmail\|gmail' src/com/wtm/ui | head -n 700 || true
