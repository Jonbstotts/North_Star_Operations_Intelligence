name: One-shot remaining shim audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-remaining-shim-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inspect remaining shim-like source
        run: |
          set -euo pipefail
          echo '=== Gmail DataPath UI source ==='
          grep -R -n -B 45 -A 90 --include='*.java' 'GMAIL DATAPATH\|Gmail DataPath\|DataPath' src/com/wtm/ui src/com/wtm/ingest src/com/wtm/modular | head -n 420 || true
          echo '=== Sidebar button source ==='
          grep -n -B 10 -A 35 'private JButton createSidebarButton' src/com/wtm/ui/OperationsWorkspaceFrame.java || true
          echo '=== Dynamic class lookup or class-name matching ==='
          grep -R -n --include='*.java' 'Class\.forName\|getClass()\.getName\|\.getName().contains' src || true
