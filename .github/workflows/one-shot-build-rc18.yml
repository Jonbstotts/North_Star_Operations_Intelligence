name: Build NorthStar GUI RC18

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc18.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin clean RC18 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 11873427fe741e1cbd1b748c25b35f01e2de8b8f
          test "$(git rev-parse HEAD)" = "11873427fe741e1cbd1b748c25b35f01e2de8b8f"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC18.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC18.jar > NorthStar-v2.1.34-GUI-RC18-SHA256SUMS.txt
          {
            echo "NorthStar Operations Intelligence v2.1.34 GUI RC18"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Source tree: $(git rev-parse HEAD^{tree})"
            echo "Java: $(java -version 2>&1 | head -1)"
            echo "Build UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Purpose: cached startup playback, fluid login handoff, and NorthStar startup theme isolation"
          } > NorthStar-v2.1.34-GUI-RC18-BUILDINFO.txt
          cat NorthStar-v2.1.34-GUI-RC18-SHA256SUMS.txt

      - name: Executable JAR launch smoke
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          set +e
          HOME="$home" timeout 6s xvfb-run -a java -jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC18.jar > /tmp/northstar-launch.out 2>/tmp/northstar-launch.err
          code=$?
          set -e
          cat /tmp/northstar-launch.out || true
          cat /tmp/northstar-launch.err || true
          if [ "$code" -ne 124 ]; then
            echo "ERROR: RC18 executable JAR exited during launch smoke with code $code" >&2
            exit 1
          fi

      - name: Upload RC18 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC18
          if-no-files-found: error
          retention-days: 30
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC18.jar
            NorthStar-v2.1.34-GUI-RC18-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC18-BUILDINFO.txt
