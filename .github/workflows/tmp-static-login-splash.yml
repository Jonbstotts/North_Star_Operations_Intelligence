name: Validate Static NorthStar Login Splash

on:
  push:
    branches: [ fix/static-login-splash ]
    paths:
      - '.github/workflows/tmp-static-login-splash.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/static-login-splash
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply foundational startup simplification
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/patch_static_login_splash.py
          python3 tmp/patch_static_login_followup.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('THIRD_PARTY_NOTICES.md')
          p.write_text(p.read_text().rstrip()+"\n")
          PY
          git diff --check
          if grep -R -n --include='*.java' -E 'startupVideoAsset|startupExperience|INTRO_VIDEO|StartupMediaService|StartupPlaybackCacheService|StartupExperienceManager|org\.jcodec|Choose Intro Video|Skip Intro' src; then
            echo 'ERROR: retired startup-video source remains.' >&2
            exit 1
          fi
          if find lib -maxdepth 1 -type f -name 'jcodec*.jar' -print -quit | grep -q .; then
            echo 'ERROR: retired JCodec dependency remains.' >&2
            exit 1
          fi

      - name: Build complete regression suite
        shell: bash
        env:
          NORTHSTAR_ALLOW_NONCANONICAL_BRANCH: '1'
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null

      - name: Executable JAR launch smoke
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          set +e
          HOME="$home" timeout 6s xvfb-run -a java -jar NorthStarOperations.jar > /tmp/northstar-launch.out 2>/tmp/northstar-launch.err
          code=$?
          set -e
          cat /tmp/northstar-launch.out || true
          cat /tmp/northstar-launch.err || true
          if [ "$code" -ne 124 ]; then
            echo "ERROR: executable JAR exited during launch smoke with code $code" >&2
            exit 1
          fi

      - name: Commit canonical static-login source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out NorthStarOperations.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/tmp-static-login-splash.yml tmp/patch_static_login_splash.py tmp/patch_static_login_followup.py
          git diff --cached --check
          git commit -m 'Replace startup video with branded login splash'
          git push origin HEAD:fix/static-login-splash
