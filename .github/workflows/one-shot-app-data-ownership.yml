name: One-shot app data ownership cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-app-data-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Consolidate canonical app-data ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'src/com/wtm/ingest/DataIngestionService.java': [
              ('package com.wtm.ingest;\n\n', 'package com.wtm.ingest;\n\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path app=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence")', 'private final Path app=ConfigService.appDataDir()')
            ],
            'src/com/wtm/ingest/GmailDataPathService.java': [
              ('import com.sun.net.httpserver.HttpServer;\n', 'import com.sun.net.httpserver.HttpServer;\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path appRoot=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence");', 'private final Path appRoot=ConfigService.appDataDir();')
            ],
            'src/com/wtm/firstparty/TrackerRegistryStore.java': [
              ('package com.wtm.firstparty;\n', 'package com.wtm.firstparty;\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path file=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence","tracking","tracker-devices.csv")', 'private final Path file=ConfigService.appDataDir().resolve("tracking").resolve("tracker-devices.csv")')
            ],
            'src/com/wtm/firstparty/TrackerTripStore.java': [
              ('package com.wtm.firstparty;\n', 'package com.wtm.firstparty;\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path file=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence","tracking","tracker-trips.csv")', 'private final Path file=ConfigService.appDataDir().resolve("tracking").resolve("tracker-trips.csv")')
            ],
            'src/com/wtm/firstparty/NetworkLocationStore.java': [
              ('package com.wtm.firstparty;\n', 'package com.wtm.firstparty;\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path file=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence","tracking","logistics-network.csv")', 'private final Path file=ConfigService.appDataDir().resolve("tracking").resolve("logistics-network.csv")')
            ],
            'src/com/wtm/firstparty/TrackerTelemetryStore.java': [
              ('package com.wtm.firstparty;\n', 'package com.wtm.firstparty;\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path file=Path.of(System.getProperty("user.home"),".northstar-operations-intelligence","tracking","tracker-telemetry.csv")', 'private final Path file=ConfigService.appDataDir().resolve("tracking").resolve("tracker-telemetry.csv")')
            ],
            'src/com/wtm/ai/NorthStarIntelligenceService.java': [
              ('package com.wtm.ai;\n\n', 'package com.wtm.ai;\n\nimport com.wtm.config.ConfigService;\n'),
              ('private final Path appRoot = Path.of(System.getProperty("user.home"), ".northstar-operations-intelligence");', 'private final Path appRoot = ConfigService.appDataDir();')
            ]
          }

          for name, edits in replacements.items():
              p=Path(name)
              s=p.read_text()
              for old,new in edits:
                  if s.count(old)!=1:
                      raise SystemExit(f'{name}: expected one anchor for {old!r}, found {s.count(old)}')
                  s=s.replace(old,new)
              p.write_text(s)

          p=Path('build.sh')
          s=p.read_text()
          anchor='''# The retired standalone .northstar directory may appear only in the explicit\n# one-time Music migration path; active hardening/storage must use ConfigService.\nif grep -Fq 'Paths.get(System.getProperty("user.home"), ".northstar")' src/com/wtm/security/LocalSecurityHardening.java; then\n  echo "ERROR: LocalSecurityHardening still targets retired .northstar storage." >&2\n  exit 1\nfi\n\n'''
          gate=anchor+'''# ConfigService is the sole owner of the canonical application-data root.\n# Features derive their storage paths from appDataDir() rather than rebuilding\n# the product directory literal independently.\nif grep -R -n --include='*.java' --exclude='ConfigService.java' -F '.northstar-operations-intelligence' src; then\n  echo "ERROR: canonical app-data directory literal escaped ConfigService ownership." >&2\n  exit 1\nfi\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit('build.sh app-data gate anchor mismatch')
          p.write_text(s.replace(anchor,gate))
          PY
          if grep -R -n --include='*.java' --exclude='ConfigService.java' -F '.northstar-operations-intelligence' src; then
            echo 'Direct canonical app-data path remains outside ConfigService.' >&2
            exit 1
          fi
          git diff --check
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit app-data ownership cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ingest/DataIngestionService.java \
                  src/com/wtm/ingest/GmailDataPathService.java \
                  src/com/wtm/firstparty/TrackerRegistryStore.java \
                  src/com/wtm/firstparty/TrackerTripStore.java \
                  src/com/wtm/firstparty/NetworkLocationStore.java \
                  src/com/wtm/firstparty/TrackerTelemetryStore.java \
                  src/com/wtm/ai/NorthStarIntelligenceService.java \
                  build.sh
          git commit -m 'Centralize canonical app data paths'
          git push origin master
