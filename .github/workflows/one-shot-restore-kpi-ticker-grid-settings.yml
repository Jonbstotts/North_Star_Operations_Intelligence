name: Restore KPI ticker and grid settings

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-restore-kpi-ticker-grid-settings.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore independent Operations Snapshot movement and remove obsolete ratio UI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e6a14125f7a680178944021ace33b96e6bc766c1"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old,new,1))

