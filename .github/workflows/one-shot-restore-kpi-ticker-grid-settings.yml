name: Restore KPI ticker and grid settings

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-restore-kpi-ticker-grid-settings.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply staged workspace repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet e6a14125f7a680178944021ace33b96e6bc766c1 -- src
          python3 ci/fix_kpi_patch_script.py
          python3 ci/one_shot_restore_kpi_ticker_grid_settings.py
          git diff --check
          grep -q 'workspaceKpiMovementMode' src/com/wtm/config/AppConfig.java
          grep -q 'renderOperationsTicker' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'Operations Snapshot movement' src/com/wtm/ui/SettingsDialog.java
          ! grep -q 'Map / Information Layout' src/com/wtm/ui/SettingsDialog.java
          ! grep -q 'mapWidthSlider' src/com/wtm/ui/SettingsDialog.java
          bash build.sh

      - name: Commit repaired behavior and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-restore-kpi-ticker-grid-settings.yml
          rm ci/one_shot_restore_kpi_ticker_grid_settings.py
          rm ci/fix_kpi_patch_script.py
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/config/AppConfig.java
          git add src/com/wtm/config/ConfigService.java
          git add src/com/wtm/ui/SettingsDialog.java
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java
          git add .github/workflows/one-shot-restore-kpi-ticker-grid-settings.yml
          git add ci/one_shot_restore_kpi_ticker_grid_settings.py
          git add ci/fix_kpi_patch_script.py
          git diff --cached --check
          git commit -m 'Restore Operations Snapshot movement controls'
          git push origin HEAD:master
