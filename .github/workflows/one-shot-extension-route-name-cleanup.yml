name: One-shot extension route identity cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-extension-route-name-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove obsolete component-name extension identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          s=workspace.read_text()
          s=s.replace('''            String route,\n            String label,\n            String componentName,\n            String anchorRoute,\n''','''            String route,\n            String label,\n            String anchorRoute,\n''')
          old='''        JButton button=createSidebarButton(label,false);\n        if(componentName!=null&&!componentName.isBlank())button.setName(componentName);\n        button.addActionListener(e->action.run());\n'''
          new='''        JButton button=createSidebarButton(label,false);\n        button.addActionListener(e->action.run());\n'''
          if s.count(old)!=1: raise SystemExit('componentName route anchor mismatch')
          workspace.write_text(s.replace(old,new))

          ai=Path('src/com/wtm/app/AiEnabledMain.java')
          s=ai.read_text()
          old='''                "NorthStar Intelligence",\n                "✦  NorthStar Intelligence",\n                "northstar.ai.sidebar",\n                "Main Showcase",\n'''
          new='''                "NorthStar Intelligence",\n                "✦  NorthStar Intelligence",\n                "Main Showcase",\n'''
          if s.count(old)!=1: raise SystemExit('AI sidebar component-name anchor mismatch')
          s=s.replace(old,new)
          s=s.replace('        mount.setName(COMPACT_NAME);\n','')
          ai.write_text(s)

          music=Path('src/com/wtm/modular/ui/MusicModuleGuard.java')
          s=music.read_text()
          old='''        workspace.registerWorkspaceExtensionRoute(\n                ROUTE,ROUTE_LABEL,"northstar.music.sidebar",\n                "Main Showcase",true,()->showMusic(workspace));\n'''
          new='''        workspace.registerWorkspaceExtensionRoute(\n                ROUTE,ROUTE_LABEL,"Main Showcase",\n                true,()->showMusic(workspace));\n'''
          if s.count(old)!=1: raise SystemExit('Music sidebar component-name anchor mismatch')
          music.write_text(s.replace(old,new))
          PY
          ! grep -q 'componentName' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'northstar.ai.sidebar' src/com/wtm/app/AiEnabledMain.java
          ! grep -q 'northstar.music.sidebar' src/com/wtm/modular/ui/MusicModuleGuard.java
          ! grep -q 'mount.setName' src/com/wtm/app/AiEnabledMain.java
          git diff --check
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit route identity cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/app/AiEnabledMain.java src/com/wtm/modular/ui/MusicModuleGuard.java
          git commit -m 'Remove obsolete component-name extension identity'
          git push origin master
