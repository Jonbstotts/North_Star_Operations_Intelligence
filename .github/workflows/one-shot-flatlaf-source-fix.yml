name: FlatLaf source compatibility fix
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-flatlaf-source-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconcile legacy theme constants
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --include='*.java' 'AppTheme.DARK' src | xargs -r sed -i 's/AppTheme\.DARK/AppTheme.FLATLAF_DARK/g'
          grep -RIl --include='*.java' 'AppTheme.LIGHT' src | xargs -r sed -i 's/AppTheme\.LIGHT/AppTheme.FLATLAF_LIGHT/g'
          ! grep -R -n --include='*.java' -E 'AppTheme\.(DARK|LIGHT)' src
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -cp 'lib/*' -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
          git diff --check
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A src
          git commit -m 'Reconcile legacy theme constants with FlatLaf catalog'
          git push origin master
