name: One-shot source ownership diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-source-ownership-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect remaining compatibility ownership
        run: |
          set -euo pipefail
          echo '=== UiFinalPolish references ==='
          grep -R -n --include='*.java' 'UiFinalPolish' src || true
          echo '=== Locations compatibility text ==='
          grep -R -n -B 12 -A 20 --include='*.java' 'Manage the primary facility\|Locations & Routes' src || true
          echo '=== UI Foundation text ==='
          grep -R -n -B 8 -A 18 --include='*.java' 'NorthStar UI Foundation' src || true
          echo '=== Compile without UiFinalPolish ==='
          mv src/com/wtm/ui/UiFinalPolish.java /tmp/UiFinalPolish.java
          rm -rf /tmp/northstar-no-final-polish
          mkdir -p /tmp/northstar-no-final-polish
          if javac --release 21 -encoding UTF-8 -d /tmp/northstar-no-final-polish $(find src -name '*.java'); then
            echo 'UI_FINAL_POLISH_SOURCE_UNUSED=true'
          else
            echo 'UI_FINAL_POLISH_SOURCE_UNUSED=false'
          fi
