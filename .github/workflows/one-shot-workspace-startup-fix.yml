name: One-shot canonical workspace startup patch

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-workspace-startup-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace deferred initial Dashboard mount
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          text = path.read_text(encoding='utf-8')
          old = '        SwingUtilities.invokeLater(this::showDashboardRoute);'
          new = '        showDashboardRoute();'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one deferred Dashboard mount, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/com/wtm/ui/OperationsWorkspaceFrame.java
          test "$(git diff --numstat -- src/com/wtm/ui/OperationsWorkspaceFrame.java | awk '{print $1 ":" $2}')" = "1:1"

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java
          git commit -m 'Mount initial Dashboard synchronously'
          git push origin HEAD:master
