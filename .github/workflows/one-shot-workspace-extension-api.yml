name: One-shot workspace extension API cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-workspace-extension-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove workspace lifecycle configuration reflection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          text=path.read_text(encoding='utf-8')
          anchor='''    /** Returns the canonical active route for source-backed extension coordination. */\n    public String activeWorkspaceRouteName(){\n        return activeWorkspaceRoute==null?"":activeWorkspaceRoute;\n    }\n'''
          addition='''\n\n    /** Returns the live workspace configuration to trusted source-backed integrations. */\n    public AppConfig workspaceConfigForExtensions(){\n        return config;\n    }\n'''
          if text.count(anchor)!=1: raise SystemExit('Operations extension-config anchor mismatch')
          path.write_text(text.replace(anchor,anchor+addition,1),encoding='utf-8')

          path=Path('src/com/wtm/ui/SettingsDialog.java')
          text=path.read_text(encoding='utf-8')
          anchor='''    private final Consumer<AppConfig> onSave;\n'''
          if text.count(anchor)!=1: raise SystemExit('Settings field anchor mismatch')
          # Insert accessor just before first large control-field block, after core fields.
          target='''    private final AppTheme originalTheme;\n    private final JTabbedPane tabs=new JTabbedPane();\n'''
          replacement='''    private final AppTheme originalTheme;\n    private final JTabbedPane tabs=new JTabbedPane();\n\n    /** Returns this settings session configuration to trusted workspace integrations. */\n    public AppConfig workspaceConfigForExtensions(){\n        return cfg;\n    }\n'''
          if text.count(target)!=1: raise SystemExit('Settings accessor anchor mismatch')
          path.write_text(text.replace(target,replacement,1),encoding='utf-8')

          path=Path('src/com/wtm/modular/ui/WorkspaceLifecycleV3.java')
          text=path.read_text(encoding='utf-8')
          text=text.replace('import com.wtm.app.AiEnabledMain;\n','import com.wtm.app.AiEnabledMain;\nimport com.wtm.config.AppConfig;\nimport com.wtm.ui.OperationsWorkspaceFrame;\nimport com.wtm.ui.SettingsDialog;\n')
          text=text.replace('import java.lang.reflect.Field;\n','')

          old='''    private static String activeRoute(JFrame frame) {\n        Object value = fieldValue(frame, "activeWorkspaceRoute");\n        return value == null ? "" : value.toString();\n    }\n'''
          new='''    private static String activeRoute(JFrame frame) {\n        return frame instanceof OperationsWorkspaceFrame workspace\n                ? workspace.activeWorkspaceRouteName()\n                : "";\n    }\n'''
          if text.count(old)!=1: raise SystemExit('Lifecycle active-route anchor mismatch')
          text=text.replace(old,new,1)

          start=text.index('    private static Object configObject(Window window) {')
          end=text.index('    private static void loadMusicSettings()',start)
          replacement='''    private static AppConfig configObject(Window window) {\n        if (window instanceof SettingsDialog settings)\n            return settings.workspaceConfigForExtensions();\n        if (window instanceof OperationsWorkspaceFrame workspace)\n            return workspace.workspaceConfigForExtensions();\n        return null;\n    }\n\n    private static void setModuleToken(AppConfig cfg, String token, boolean enabled) {\n        if (cfg == null) return;\n        cfg.workspaceModules.removeIf(value -> token.equalsIgnoreCase(String.valueOf(value)));\n        if (enabled) cfg.workspaceModules.add(token);\n    }\n\n'''
          text=text[:start]+replacement+text[end:]

          start=text.find('    private static Object fieldValue(Object target, String name) {')
          if start<0: raise SystemExit('Lifecycle fieldValue helper missing')
          end=text.find('    private static String clean(String text)',start)
          if end<0: raise SystemExit('Lifecycle clean helper anchor missing')
          text=text[:start]+text[end:]
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-config-api $(find src -name '*.java')
          ! grep -q 'java.lang.reflect' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'getDeclaredField' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'activeWorkspaceRouteName' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'workspaceConfigForExtensions' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          git diff --stat
      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/ui/SettingsDialog.java src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          git commit -m 'Remove workspace lifecycle configuration reflection'
          git push origin HEAD:master
