name: Polish Data Collection and Workspace Setup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-polish-data-workspace-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply UI polish and Information-row invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/polish_data_workspace_ui.py
          ! grep -Fq 'new JCheckBox("Custom Information Blocks")' src/com/wtm/ui/SettingsDialog.java
          ! grep -Fq 'workspaceInfoStrip.isSelected()' src/com/wtm/ui/SettingsDialog.java
          ! grep -Fq 'workspaceInfoStrip.setSelected' src/com/wtm/ui/SettingsDialog.java
          grep -Fq 'cfg.workspaceInfoStripEnabled=true;' src/com/wtm/config/ConfigService.java
          grep -Fq 'Information is a core dashboard row' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -Fq 'controls.add(controlContent, BorderLayout.NORTH)' src/com/wtm/ui/DataCollectionPanel.java
          git diff --check

      - name: Build canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit polished source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/com/wtm/ui/DataCollectionPanel.java \
            src/com/wtm/ui/SettingsDialog.java \
            src/com/wtm/config/AppConfig.java \
            src/com/wtm/config/ConfigService.java \
            src/com/wtm/ui/OperationsWorkspaceFrame.java \
            ci/ConfigRoundTripSmokeTest.java
          git diff --cached --check
          git commit -m 'Polish data import alignment and simplify Information row setup'
          git push origin HEAD:master
