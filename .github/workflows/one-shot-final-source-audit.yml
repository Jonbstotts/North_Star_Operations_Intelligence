name: One-shot final source consistency audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-final-source-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Final source consistency audit
        run: |
          set -euo pipefail
          echo '=== canonical version/product identity ==='
          grep -R -n --include='*.java' --include='*.sh' --include='*.mf' -E '2\.1\.[0-9]+|Implementation-Version|Main-Class|WeatherTrafficMonitor|ORIVUE|Orivue|v[0-9]+\.[0-9]+' src build.sh META-INF 2>/dev/null || true
          echo '=== deprecated/compatibility markers ==='
          grep -R -n --include='*.java' -Ei '@Deprecated|compatib|legacy|deprecated|workaround|temporary|hack|shim|fallback' src | head -n 500 || true
          echo '=== ignored exceptions ==='
          grep -R -n --include='*.java' -E 'catch\([^)]* ignored\)|catch \([^)]* ignored\)' src | head -n 300 || true
          echo '=== TODO/FIXME/XXX ==='
          grep -R -n --include='*.java' -E 'TODO|FIXME|XXX' src || true
          echo '=== direct user-home paths ==='
          grep -R -n --include='*.java' 'System.getProperty("user.home")' src || true
          echo '=== dangerous runtime discovery ==='
          grep -R -n --include='*.java' -E 'Class\.forName|java\.lang\.reflect|setAccessible|addAWTEventListener|Window\.getWindows|getDeclaredField|getDeclaredMethod' src || true
          echo '=== javac/build ==='
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
