name: Retry RC4 dashboard, theme, and header repair
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-dashboard-theme-rc4-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute corrected RC4 source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-shot-dashboard-theme-rc4-fixes.yml')
          lines=p.read_text().splitlines()
          start=None
          for i,line in enumerate(lines):
              if line.strip()=='run: |':
                  start=i+1
                  break
          if start is None: raise SystemExit('source workflow run block missing')
          block=[]
          for line in lines[start:]:
              if line.startswith('          '): block.append(line[10:])
              else: break
          script='\n'.join(block)+'\n'
          script=script.replace('workspace.removeDashboardExtension(MUSIC_MINI_MARK);','workspace.removeSummaryExtension(MUSIC_MINI_MARKER);')
          Path('/tmp/rc4-repair.sh').write_text(script)
          PY
          bash /tmp/rc4-repair.sh
