name: Build NorthStar v2.1.34 GUI RC4
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-rc4-artifact.yml'
permissions:
  contents: read
jobs:
  build-rc4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify RC4
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar > NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4-SHA256SUMS.txt
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar | grep -Fxq 'glyphs/northstar_dashboard_row0.png'
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar | grep -Fxq 'glyphs/northstar_dashboard_row1.png'
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar | grep -Fxq 'glyphs/northstar_dashboard_row2.png'
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar | grep -Fxq 'glyphs/northstar_dashboard_row3.png'
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar | grep -Fxq 'brand/northstar_primary_logo_exact.png'
          unzip -t NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC4
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4.jar
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC4-SHA256SUMS.txt
          if-no-files-found: error
