name: NorthStar Canonical Source Validation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Regression loop 1 - clean canonical source compile
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          rm -rf out
          mkdir -p out
          javac --release 21 -encoding UTF-8 -d out $(find src -name '*.java')
          test -f out/com/wtm/modular/ui/MusicModuleGuard.class
          test -f out/com/wtm/modular/ui/WorkspaceUiRecoveryGuard.class
          test -f out/com/wtm/modular/ui/SidebarModulesGlyphGuard.class
          test -f out/com/wtm/modular/ui/TrustedEmailUiGuard.class
          test -f out/com/wtm/modular/ui/DashboardGlyphArtGuard.class
          grep -q '127.0.0.1' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'MusicKit' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'NorthStar never receives your Apple ID password' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'MusicModuleGuard' src/com/wtm/app/NorthStarMainStable.java
          echo "REGRESSION_LOOP_1_SOURCE_OK"
      - name: Regression loop 2 - clean source package integrity
        run: |
          set -euo pipefail
          rm -rf out-second
          mkdir -p out-second
          javac --release 21 -encoding UTF-8 -d out-second $(find src -name '*.java')
          if [ -d resources ]; then cp -R resources/. out-second/; fi
          if [ -d brand ]; then mkdir -p out-second/brand && cp -R brand/. out-second/brand/; fi
          if [ -d glyphs ]; then mkdir -p out-second/glyphs && cp -R glyphs/. out-second/glyphs/; fi
          jar --create --file NorthStar-source-validation.jar --manifest MANIFEST.MF -C out-second .
          DUPLICATES=$(zipinfo -1 NorthStar-source-validation.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -tq NorthStar-source-validation.jar >/dev/null
          unzip -p NorthStar-source-validation.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.30-music-audio-apple-music-phase1'
          for entry in \
            com/wtm/modular/ui/MusicModuleGuard.class \
            com/wtm/modular/ui/WorkspaceUiRecoveryGuard.class \
            com/wtm/modular/ui/SidebarModulesGlyphGuard.class \
            com/wtm/modular/ui/TrustedEmailUiGuard.class \
            com/wtm/modular/ui/DashboardGlyphArtGuard.class \
            brand/northstar_primary_logo_exact.png; do
            jar tf NorthStar-source-validation.jar | grep -Fxq "$entry"
          done
          echo "REGRESSION_LOOP_2_SOURCE_OK"

# Important: this workflow intentionally validates source only and does not
# publish a runnable release artifact. The current stable runtime contains
# stabilized classes from v2.1.29 that are still being reconciled back into
# canonical Java source. Publishing a JAR from an older migration baseline
# would silently remove those fixes. Release packaging must therefore preserve
# the verified v2.1.29 runtime baseline until source reconciliation is complete.
