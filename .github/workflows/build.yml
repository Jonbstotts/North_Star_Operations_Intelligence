name: NorthStar Canonical Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NorthStar
        run: |
          chmod +x build.sh
          ./build.sh
          sha256sum NorthStarOperations.jar > NorthStar-v2.1.30-SHA256SUMS.txt
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.30-music-audio
          path: |
            NorthStarOperations.jar
            NorthStar-v2.1.30-SHA256SUMS.txt
          if-no-files-found: error
