name: NorthStar Canonical Source Validation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Canonical source-root policy
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          LEGACY_ROOTS=(alerts callin config employee importer location map media model net radar security service sports traffic truck ui usage util weather)
          for d in "${LEGACY_ROOTS[@]}"; do
            if [ -d "$d" ] && find "$d" -name '*.java' -print -quit | grep -q .; then
              echo "Unexpected legacy source root: $d" >&2
              exit 1
            fi
          done
          test -d legacy_source_snapshot
          test -d src/com/wtm
          grep -q '^Main-Class: com.wtm.app.NorthStarMainStable$' MANIFEST.MF
          grep -q '^Implementation-Version: 2.1.34-clean-sweep$' MANIFEST.MF

      - name: Lifecycle ownership regression
        run: |
          set -euo pipefail
          test -f src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'WorkspaceLifecycleV3' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'WorkspaceUiRecoveryGuard.*install' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'MusicWorkspacePolishGuard.*install' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'StartupDashboardReadyGuard.*install' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'MusicModuleGuard.*install' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'DashboardGlyphArtGuard' src/com/wtm/app/NorthStarMainStable.java
          ! test -f src/com/wtm/modular/ui/DashboardGlyphArtGuard.java
          ! test -f src/com/wtm/modular/ui/TrustedEmailUiGuard.java
          ! grep -q 'SidebarModulesGlyphGuard' src/com/wtm/app/NorthStarMainStable.java
          ! test -f src/com/wtm/modular/ui/SidebarModulesGlyphGuard.java
          ! grep -q 'AnnouncementBorderGuard' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'StartupUiGuard' src/com/wtm/app/NorthStarMainStable.java
          ! grep -q 'NetworkGeocodingService' src/com/wtm/app/NorthStarMainStable.java
          ! test -f src/com/wtm/modular/ui/RuntimeStabilizer.java
          ! test -f src/com/wtm/modular/core/ModularBootstrap.java
          ! grep -q 'COMPONENT_ADDED' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'CONTAINER_EVENT_MASK' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'ContainerEvent' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'addAWTEventListener' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'AWTEvent' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'Window.getWindows' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'WINDOW_ACTIVATED' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'WINDOW_OPENED' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'ACTION_EVENT_MASK' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'WeakHashMap' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'SwingUtilities.invokeLater' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'new Timer' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'invokeStaticFrame' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! grep -q 'DashboardGlyphArtGuard' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'AiEnabledMain.injectDashboard' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'MusicModuleGuard.installWorkspace' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'WorkspaceLifecycleV3.initializeWorkspace(this)' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'WorkspaceLifecycleV3.dashboardMounted(this)' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'WorkspaceLifecycleV3.routeMounted' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'routeMounted' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          grep -q 'WorkspaceLifecycleV3.settingsReady(this)' src/com/wtm/ui/SettingsDialog.java
          grep -q 'WorkspaceLifecycleV3.persistSettings(this)' src/com/wtm/ui/SettingsDialog.java
          grep -q 'WorkspaceLifecycleV3.settingsApplied(this)' src/com/wtm/ui/SettingsDialog.java
          ! grep -q 'SwingUtilities.invokeLater(this::showDashboardRoute)' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'showDashboardRoute();' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'AWTEventListener' src/com/wtm/modular/ui/MusicModuleGuard.java
          ! grep -q 'COMPONENT_ADDED' src/com/wtm/modular/ui/MusicModuleGuard.java
          ! grep -q 'new Timer' src/com/wtm/modular/ui/MusicModuleGuard.java
          ! grep -q 'w.isDisplayable' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'styleCombo(playlists)' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'HORIZONTAL_SCROLLBAR_NEVER' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q 'addComponentListener' src/com/wtm/modular/ui/MusicModuleGuard.java
          ! grep -q 'polishMusicTree' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          ! test -f src/com/wtm/ui/foundation/UiFoundationRuntime.java
          ! test -f src/com/wtm/ui/foundation/UiFoundation.java
          ! grep -q 'UiFoundationRuntime' src/com/wtm/app/NorthStarMainStable.java
          grep -q 'ThemeStyler.apply(this,Theme.active())' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! test -f src/com/wtm/ui/UiFinalPolish.java
          ! test -f src/com/wtm/ui/ThemeCoreV216.java
          ! test -f src/com/wtm/ui/NorthStarThemeCompliance.java
          ! grep -q 'ThemeCoreV216' src/com/wtm/ui/ThemeStyler.java
          grep -q 'apple.awt.windowAppearance' src/com/wtm/ui/ThemeStyler.java

      - name: Presentation ownership regression
        run: |
          set -euo pipefail
          ! test -f src/com/wtm/ui/UiFinalPolish.java
          ! test -f src/com/wtm/ui/ThemeCoreV216.java
          ! test -f src/com/wtm/ui/NorthStarThemeCompliance.java
          grep -q 'button.putClientProperty("northstar.sidebar.route",Boolean.TRUE)' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'getClass().getName' src/com/wtm/ui/ThemeStyler.java
          ! grep -qi 'data collection' src/com/wtm/ui/ThemeStyler.java
          ! grep -qi 'northstar intelligence' src/com/wtm/ui/ThemeStyler.java
          grep -q 'hideDirectoryColumn("Employee #")' src/com/wtm/ui/EmployeeOperationsPanel.java
          grep -q 'split.setDividerSize(0)' src/com/wtm/ui/EmployeeOperationsPanel.java
          grep -q 'scrollableSettingsPage' src/com/wtm/ui/SettingsDialog.java
          grep -q 'VERTICAL_SCROLLBAR_AS_NEEDED' src/com/wtm/ui/SettingsDialog.java
          grep -q 'HORIZONTAL_SCROLLBAR_NEVER' src/com/wtm/ui/SettingsDialog.java
          ! grep -q 'java.lang.reflect' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'getDeclaredField' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'rotationTimer' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'mainShowcaseMediaEnabled' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'operationsAnnouncementsEnabled' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'mainShowcaseIntervalSeconds' src/com/wtm/ui/ThemeStyler.java

      - name: Data Collection reconciliation regression
        run: |
          set -euo pipefail
          test -f src/com/wtm/ui/DataCollectionPanel.java
          test -f src/com/wtm/ingest/DataIngestionService.java
          test -f src/com/wtm/ingest/GmailDataPathService.java
          test -f src/com/wtm/ingest/TrustedSenderPolicy.java
          grep -q 'class DataCollectionPanel' src/com/wtm/ui/DataCollectionPanel.java
          grep -q 'TRUSTED EMAIL SENDERS' src/com/wtm/ui/DataCollectionPanel.java
          grep -q 'TrustedSenderPolicy.parse' src/com/wtm/ui/DataCollectionPanel.java
          grep -q 'sideDataCollectionButton' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'Permission.DATA_REFRESH' src/com/wtm/ui/DataCollectionPanel.java
          ! test -f src/com/wtm/modular/ui/TrustedEmailUiGuard.java
          ! grep -R -q --include='*.java' 'GlassSurfacePanel' src

      - name: Intelligence reconciliation regression
        run: |
          set -euo pipefail
          test -f src/com/wtm/ingest/OperationalAnalytics.java
          test -f src/com/wtm/ui/IntelligenceGlassSettings.java
          test -f src/com/wtm/ai/NorthStarIntelligenceService.java
          test -f src/com/wtm/ui/NorthStarIntelligencePanel.java
          test -f src/com/wtm/ui/NorthStarIntelligenceCompactPanel.java
          test -f src/com/wtm/app/AiEnabledMain.java
          grep -q 'VERIFIED NORTHSTAR OPERATIONAL DATA' src/com/wtm/ingest/OperationalAnalytics.java
          grep -q 'Blank LHY rows are PARTIAL' src/com/wtm/ingest/OperationalAnalytics.java
          grep -q 'evidence-grounded' src/com/wtm/ai/NorthStarIntelligenceService.java
          grep -q 'AI_ASSISTANT' src/com/wtm/security/Permission.java
          grep -q 'AI_KNOWLEDGE_ADMIN' src/com/wtm/security/Permission.java
          grep -q 'AI_EMPLOYEE_METRICS' src/com/wtm/security/Permission.java
          grep -q 'dashboardBody' src/com/wtm/app/AiEnabledMain.java
          ! grep -q 'DashboardGridPanel' src/com/wtm/app/AiEnabledMain.java
          ! grep -q 'isShowing()' src/com/wtm/app/AiEnabledMain.java
          ! grep -q 'new Timer' src/com/wtm/ui/IntelligenceGlassSettings.java
          ! grep -q 'AWTEventListener' src/com/wtm/ui/IntelligenceGlassSettings.java
          ! grep -q 'new Timer' src/com/wtm/app/AiEnabledMain.java
          ! grep -q 'AWTEventListener' src/com/wtm/app/AiEnabledMain.java

      - name: Security regression pass
        run: |
          set -euo pipefail
          grep -q 'LocalSecurityHardening' src/com/wtm/app/NorthStarMainStable.java
          grep -q 'PBKDF2WithHmacSHA256' src/com/wtm/security/UserService.java
          grep -q 'MessageDigest.isEqual' src/com/wtm/security/UserService.java
          grep -q 'SecureFiles.storePropertiesAtomic' src/com/wtm/config/ApiCredentialService.java
          grep -q 'Fail closed' src/com/wtm/ingest/TrustedSenderPolicy.java
          grep -q 'trusted sender' src/com/wtm/ingest/GmailDataPathService.java
          grep -q '127.0.0.1' src/com/wtm/modular/ui/MusicModuleGuard.java
          grep -q '127.0.0.1' src/com/wtm/ai/NorthStarIntelligenceService.java
          if grep -R --line-number -E 'Runtime\.getRuntime\(\)\.exec|ObjectInputStream|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' src; then
            echo 'Unsafe execution/deserialization/private-key material found in canonical source.' >&2
            exit 1
          fi
          if grep -R --line-number -E 'http://[^" ]+' src | grep -Ev '127\.0\.0\.1|localhost'; then
            echo 'Non-loopback plaintext HTTP URL found in canonical source.' >&2
            exit 1
          fi

      - name: Regression loop 1 - clean canonical source compile
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          javac --release 21 -encoding UTF-8 -d out $(find src -name '*.java')
          test -f out/com/wtm/modular/ui/MusicModuleGuard.class
          test -f out/com/wtm/modular/ui/WorkspaceLifecycleV3.class
          test -f out/com/wtm/ui/DataCollectionPanel.class
          test -f out/com/wtm/security/LocalSecurityHardening.class
          test -f out/com/wtm/ingest/OperationalAnalytics.class
          test -f out/com/wtm/ui/IntelligenceGlassSettings.class
          test -f out/com/wtm/ai/NorthStarIntelligenceService.class
          test -f out/com/wtm/ui/NorthStarIntelligencePanel.class
          test -f out/com/wtm/ui/NorthStarIntelligenceCompactPanel.class
          test -f out/com/wtm/app/AiEnabledMain.class
          echo "REGRESSION_LOOP_1_SOURCE_OK"

      - name: Regression loop 2 - clean source package integrity
        run: |
          set -euo pipefail
          rm -rf out-second
          mkdir -p out-second
          javac --release 21 -encoding UTF-8 -d out-second $(find src -name '*.java')
          if [ -d resources ]; then cp -R resources/. out-second/; fi
          if [ -d brand ]; then mkdir -p out-second/brand && cp -R brand/. out-second/brand/; fi
          if [ -d glyphs ]; then mkdir -p out-second/glyphs && cp -R glyphs/. out-second/glyphs/; fi
          jar --create --file NorthStar-source-validation.jar --manifest MANIFEST.MF -C out-second .
          DUPLICATES=$(zipinfo -1 NorthStar-source-validation.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -tq NorthStar-source-validation.jar >/dev/null
          unzip -p NorthStar-source-validation.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'
          for entry in \
            com/wtm/modular/ui/MusicModuleGuard.class \
            com/wtm/modular/ui/WorkspaceLifecycleV3.class \
            com/wtm/ui/DataCollectionPanel.class \
            com/wtm/security/LocalSecurityHardening.class \
            com/wtm/ingest/OperationalAnalytics.class \
            com/wtm/ui/IntelligenceGlassSettings.class \
            com/wtm/ai/NorthStarIntelligenceService.class \
            com/wtm/ui/NorthStarIntelligencePanel.class \
            com/wtm/ui/NorthStarIntelligenceCompactPanel.class \
            com/wtm/app/AiEnabledMain.class \
            brand/northstar_primary_logo_exact.png; do
            jar tf NorthStar-source-validation.jar | grep -Fxq "$entry"
          done
          echo "REGRESSION_LOOP_2_SOURCE_OK"

      - name: Canonical build-script gate
        run: |
          set -euo pipefail
          bash build.sh
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          echo "CANONICAL_BUILD_GATE_OK"

# This workflow validates the canonical src tree and its packaged integrity.
# Historical branches and archived root source trees are never release inputs.
