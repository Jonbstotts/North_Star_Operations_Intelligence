name: One-shot startup theme ownership fix

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-theme-startup-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore source-owned theme selection at startup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main=Path('src/com/wtm/app/Main.java')
          s=main.read_text()
          old='''                        AppTheme theme=AppTheme.NORTH_STAR;\n                        config.themeId=theme.id();\n                        config.darkMode=true;\n                        Theme.setActive(theme.id());\n'''
          new='''                        AppTheme theme=HolidayThemeService.effectiveTheme(\n                                config,\n                                java.time.LocalDate.now()\n                        );\n                        config.darkMode=theme.dark();\n                        Theme.setActive(theme.id());\n'''
          if s.count(old)!=1:
              raise SystemExit('startup theme anchor mismatch')
          main.write_text(s.replace(old,new))

          build=Path('build.sh')
          b=build.read_text()
          anchor='''rm -rf out\n'''
          gate='''# Startup must honor the configured/manual theme (with optional holiday override)\n# rather than silently resetting every session to North Star.\nif grep -Fq 'config.themeId=theme.id();' src/com/wtm/app/Main.java || \\
   grep -Fq 'config.darkMode=true;' src/com/wtm/app/Main.java || \\
   ! grep -Fq 'HolidayThemeService.effectiveTheme(' src/com/wtm/app/Main.java; then\n  echo "ERROR: startup theme ownership regressed to a hard-coded preset." >&2\n  exit 1\nfi\n\n'''+anchor
          if b.count(anchor)!=1:
              raise SystemExit('build output anchor mismatch')
          build.write_text(b.replace(anchor,gate))
          PY
          git diff --check
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit startup theme fix
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/app/Main.java build.sh
          git commit -m 'Honor configured theme during startup'
          git push origin master
