name: Materialize NorthStar glyph atlases
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-materialize-glyphs.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Materialize glyph PNGs and validate build
        shell: bash
        run: |
          set -euo pipefail
          for row in 0 1 2 3; do
            cat resources/glyphs/northstar_dashboard_row${row}.png.b64.* | tr -d '\r\n' | base64 --decode > resources/glyphs/northstar_dashboard_row${row}.png
            file resources/glyphs/northstar_dashboard_row${row}.png
          done
          rm -rf resources/glyphs/staging
          rm -f resources/glyphs/northstar_dashboard_row*.png.b64.*
          bash build.sh
          for row in 0 1 2 3; do
            jar tf NorthStarOperations.jar | grep -Fxq "glyphs/northstar_dashboard_row${row}.png"
          done
          git diff --check
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add resources/glyphs
          git commit -m 'Materialize NorthStar dashboard glyph atlases'
          git push origin master
