name: One-shot ThemeCore retirement

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-themecore-retirement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Move dialog platform appearance into ThemeStyler
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/com/wtm/ui/ThemeStyler.java')
          text=path.read_text(encoding='utf-8')
          old='''        applyRecursive(component,resolved);\n        ThemeCoreV216.applyImmediate(component);'''
          new='''        applyRecursive(component,resolved);'''
          if text.count(old)!=1:
              raise SystemExit(f'ThemeCore call anchor mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''        if(component instanceof JDialog dialog){\n            dialog.setBackground(bg);\n            if(dialog.getRootPane()!=null){\n                dialog.getRootPane().setOpaque(true);'''
          new='''        if(component instanceof JDialog dialog){\n            dialog.setBackground(bg);\n            if(dialog.getRootPane()!=null){\n                dialog.getRootPane().putClientProperty(\n                        "apple.awt.windowAppearance",\n                        theme.dark()?"NSAppearanceNameDarkAqua":"NSAppearanceNameAqua");\n                dialog.getRootPane().setOpaque(true);'''
          if text.count(old)!=1:
              raise SystemExit(f'JDialog theme anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          mv src/com/wtm/ui/ThemeCoreV216.java /tmp/ThemeCoreV216.java
          git diff --check
          grep -q 'apple.awt.windowAppearance' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'ThemeCoreV216' src/com/wtm/ui/ThemeStyler.java
          rm -rf /tmp/northstar-no-theme-core
          mkdir -p /tmp/northstar-no-theme-core
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-no-theme-core $(find src -name '*.java')
          rm /tmp/ThemeCoreV216.java
          git rm src/com/wtm/ui/ThemeCoreV216.java
          git diff --check
          git diff -- src/com/wtm/ui/ThemeStyler.java src/com/wtm/ui/ThemeCoreV216.java
      - name: Commit ThemeCore retirement
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/ThemeStyler.java src/com/wtm/ui/ThemeCoreV216.java
          git commit -m 'Retire redundant ThemeCore compatibility layer'
          git push origin HEAD:master
