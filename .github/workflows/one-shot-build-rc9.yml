name: Build NorthStar GUI RC9

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc9.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC9 source
        uses: actions/checkout@v4
        with:
          ref: 2530a2acc0875d54826248a7e689e2fbcf8632c1
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC9
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2530a2acc0875d54826248a7e689e2fbcf8632c1"
          ! grep -q 'Map / Information Layout' src/com/wtm/ui/SettingsDialog.java
          ! grep -q 'mapWidthSlider' src/com/wtm/ui/SettingsDialog.java
          grep -q 'Operations Snapshot movement' src/com/wtm/ui/SettingsDialog.java
          grep -q 'renderOperationsTicker' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'configureOperationsRotation' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'workspaceKpiMovementMode' src/com/wtm/config/AppConfig.java
          grep -q 'workspace.kpis.movementMode' src/com/wtm/config/ConfigService.java
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'
          for entry in \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png \
            com/wtm/ui/NorthStarDashboardGlyphs.class \
            com/wtm/ui/DashboardGridPanel.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/ui/SettingsDialog.class \
            com/wtm/config/AppConfig.class \
            com/wtm/config/ConfigService.class; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done
          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC9.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC9-SHA256SUMS.txt
          echo "RC9_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "RC9_JAR=$OUT"

      - name: Upload RC9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC9
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC9.jar
            NorthStar-v2.1.34-GUI-RC9-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
