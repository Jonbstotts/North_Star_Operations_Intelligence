name: Restore fixed header text and sparse ticker
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-header-ticker-spacing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch header title and ticker spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          s=path.read_text()

          old='''        JPanel chrome=new JPanel(new BorderLayout());
        chrome.setOpaque(false);
        chrome.add(bar,BorderLayout.NORTH);
        chrome.add(new HeaderTicker(config.tickerText),BorderLayout.SOUTH);
        return chrome;
    }

    private void toggleDashboardLayoutFromGear(){'''
          new='''        JPanel chrome=new JPanel(new BorderLayout());
        chrome.setOpaque(false);
        chrome.add(bar,BorderLayout.NORTH);
        chrome.add(buildHeaderTickerStrip(),BorderLayout.SOUTH);
        return chrome;
    }

    private JComponent buildHeaderTickerStrip(){
        JPanel strip=new JPanel(new BorderLayout(14,0));
        strip.setOpaque(true);
        strip.setBackground(Theme.panel2());
        strip.setBorder(BorderFactory.createMatteBorder(
                0,0,1,0,Theme.border()));
        strip.setPreferredSize(new Dimension(100,24));

        if(config.showHeader
                &&config.headerText!=null
                &&!config.headerText.isBlank()){
            JLabel headerTitle=new JLabel(config.headerText.trim());
            headerTitle.setForeground(Theme.text());
            headerTitle.setFont(new Font(Font.SANS_SERIF,Font.BOLD,11));
            headerTitle.setBorder(new EmptyBorder(0,12,0,2));
            strip.add(headerTitle,BorderLayout.WEST);
        }

        HeaderTicker ticker=new HeaderTicker(config.tickerText);
        ticker.setBorder(new EmptyBorder(0,10,0,12));
        strip.add(ticker,BorderLayout.CENTER);
        return strip;
    }

    private void toggleDashboardLayoutFromGear(){'''
          if old not in s:
              raise SystemExit('top ticker strip anchor not found')
          s=s.replace(old,new,1)

          old='''        private HeaderTicker(String text){
            message="  "+text.trim()+"  •  ";
            setOpaque(true);
            setBackground(Theme.panel2());
            setForeground(Theme.text());
            setFont(new Font(Font.SANS_SERIF,Font.BOLD,11));
            setBorder(BorderFactory.createMatteBorder(
                    0,0,1,0,Theme.border()));
            setPreferredSize(new Dimension(100,24));

            timer=new javax.swing.Timer(35,e->{
                FontMetrics metrics=getFontMetrics(getFont());
                int cycle=Math.max(1,metrics.stringWidth(message)+80);
                offset=(offset+1)%cycle;
                repaint();
            });
            timer.setCoalesce(true);
        }'''
          new='''        private HeaderTicker(String text){
            message=text.trim();
            setOpaque(false);
            setForeground(Theme.text());
            setFont(new Font(Font.SANS_SERIF,Font.BOLD,11));

            timer=new javax.swing.Timer(35,e->{
                FontMetrics metrics=getFontMetrics(getFont());
                int messageWidth=Math.max(1,metrics.stringWidth(message));
                int travel=Math.max(1,getWidth()+messageWidth+240);
                offset=(offset+1)%travel;
                repaint();
            });
            timer.setCoalesce(true);
        }'''
          if old not in s:
              raise SystemExit('ticker constructor anchor not found')
          s=s.replace(old,new,1)

          old='''                int cycle=Math.max(1,metrics.stringWidth(message)+80);
                int baseline=(getHeight()+metrics.getAscent()-metrics.getDescent())/2;
                for(int x=-offset;x<getWidth();x+=cycle)
                    g2.drawString(message,x,baseline);'''
          new='''                int baseline=(getHeight()+metrics.getAscent()-metrics.getDescent())/2;
                int x=getWidth()+80-offset;
                g2.drawString(message,x,baseline);'''
          if old not in s:
              raise SystemExit('ticker paint anchor not found')
          s=s.replace(old,new,1)

          path.write_text(s)

          build=Path('build.sh')
          b=build.read_text()
          gate='''# Header/ticker ownership: the configured header text is fixed ahead of a
# single-copy scrolling ticker. Do not return to dense repeated ticker copies.
if ! grep -Fq 'buildHeaderTickerStrip()' src/com/wtm/ui/OperationsWorkspaceFrame.java || \\
   ! grep -Fq 'config.headerText.trim()' src/com/wtm/ui/OperationsWorkspaceFrame.java || \\
   grep -Fq 'for(int x=-offset;x<getWidth();x+=cycle)' src/com/wtm/ui/OperationsWorkspaceFrame.java; then
  echo "ERROR: fixed header / sparse ticker regression detected." >&2
  exit 1
fi

'''
          anchor='# Dashboard layout editing is owned by the top-right dashboard gear;'
          if gate not in b:
              if anchor not in b:
                  raise SystemExit('build gate anchor not found')
              b=b.replace(anchor,gate+anchor,1)
              build.write_text(b)
          PY

          git diff --check
          bash build.sh
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java build.sh
          git commit -m 'Restore fixed header text and reduce ticker repetition'
          git push origin master
