name: One-shot retire UI foundation runtime

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-retire-ui-foundation-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Move initial workspace styling into workspace owner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher=Path('src/com/wtm/app/NorthStarMainStable.java')
          text=launcher.read_text(encoding='utf-8')
          text=text.replace('import com.wtm.ui.foundation.UiFoundationRuntime;\n','')
          old='''        WorkspaceLifecycleV3.install();\n        UiFoundationRuntime.start();\n        Main.main(args);'''
          new='''        WorkspaceLifecycleV3.install();\n        Main.main(args);'''
          if text.count(old)!=1:
              raise SystemExit(f'launcher UI foundation anchor mismatch: {text.count(old)}')
          launcher.write_text(text.replace(old,new,1),encoding='utf-8')

          frame=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          text=frame.read_text(encoding='utf-8')
          old='''        overlayEffects.setVisible(true);\n\n        buildUi();\n        startRefreshers();'''
          new='''        overlayEffects.setVisible(true);\n\n        buildUi();\n        ThemeStyler.apply(this,Theme.active());\n        startRefreshers();'''
          if text.count(old)!=1:
              raise SystemExit(f'workspace constructor theme anchor mismatch: {text.count(old)}')
          frame.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git rm src/com/wtm/ui/foundation/UiFoundationRuntime.java src/com/wtm/ui/foundation/UiFoundation.java
          git diff --check
          ! grep -R -q --include='*.java' 'UiFoundationRuntime\|UiFoundation\.apply' src
          grep -q 'ThemeStyler.apply(this,Theme.active())' src/com/wtm/ui/OperationsWorkspaceFrame.java
          rm -rf /tmp/northstar-no-ui-foundation
          mkdir -p /tmp/northstar-no-ui-foundation
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-no-ui-foundation $(find src -name '*.java')
          git diff -- src/com/wtm/app/NorthStarMainStable.java src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/ui/foundation/UiFoundationRuntime.java src/com/wtm/ui/foundation/UiFoundation.java
      - name: Commit source ownership cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A src/com/wtm/app/NorthStarMainStable.java src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/ui/foundation
          git commit -m 'Retire global UI foundation runtime'
          git push origin HEAD:master
