name: One-shot Music lifecycle cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-music-lifecycle-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Move Music cosmetics into Music module and remove container lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          music = Path('src/com/wtm/modular/ui/MusicModuleGuard.java')
          text = music.read_text(encoding='utf-8')
          old = 'import java.awt.*;\nimport java.io.IOException;'
          new = 'import java.awt.*;\nimport java.awt.event.ComponentAdapter;\nimport java.awt.event.ComponentEvent;\nimport java.io.IOException;'
          if text.count(old) != 1: raise SystemExit('Music imports anchor mismatch')
          text = text.replace(old, new, 1)
          old = '            JScrollPane scroll=new JScrollPane(body);scroll.setBorder(null);scroll.setOpaque(false);scroll.getViewport().setOpaque(false);scroll.getVerticalScrollBar().setUnitIncrement(18);add(scroll,BorderLayout.CENTER);'
          new = '            JScrollPane scroll=new JScrollPane(body);scroll.setBorder(null);scroll.setOpaque(false);scroll.getViewport().setOpaque(false);scroll.getVerticalScrollBar().setUnitIncrement(18);prepareScroll(scroll,body);add(scroll,BorderLayout.CENTER);'
          if text.count(old) != 1: raise SystemExit('Music scroll anchor mismatch')
          text = text.replace(old, new, 1)
          old = '            JPanel p=flow();playlists.setPreferredSize(new Dimension(280,34));p.add(playlists);p.add(button("Play Playlist",()->{MusicPlaylist x=(MusicPlaylist)playlists.getSelectedItem();if(x!=null)service.command("playlist:"+x.playId());}));p.add(button("◀",()->service.command("prev")));p.add(button("▶",()->service.command("play")));p.add(button("❚❚",()->service.command("pause")));p.add(button("▶▶",()->service.command("next")));return p;'
          new = '            JPanel p=flow();styleCombo(playlists);playlists.setPreferredSize(new Dimension(280,34));p.add(playlists);p.add(button("Play Playlist",()->{MusicPlaylist x=(MusicPlaylist)playlists.getSelectedItem();if(x!=null)service.command("playlist:"+x.playId());}));p.add(button("◀",()->service.command("prev")));p.add(button("▶",()->service.command("play")));p.add(button("❚❚",()->service.command("pause")));p.add(button("▶▶",()->service.command("next")));return p;'
          if text.count(old) != 1: raise SystemExit('Music playback combo anchor mismatch')
          text = text.replace(old, new, 1)
          old = '            JPanel p=flow();JTextField zone=new JTextField(service.settings.facilityZone,18);JComboBox<String> eq=new JComboBox<>(new String[]{"Balanced","Voice","Bass Boost","Bright"});eq.setSelectedItem(service.settings.eqPreset);p.add(new JLabel("Zone"));p.add(zone);p.add(new JLabel("EQ"));p.add(eq);p.add(button("Save",()->{service.settings.facilityZone=zone.getText().trim();service.settings.eqPreset=Objects.toString(eq.getSelectedItem(),"Balanced");service.save();}));return p;'
          new = '            JPanel p=flow();JTextField zone=new JTextField(service.settings.facilityZone,18);JComboBox<String> eq=new JComboBox<>(new String[]{"Balanced","Voice","Bass Boost","Bright"});styleCombo(eq);eq.setSelectedItem(service.settings.eqPreset);p.add(new JLabel("Zone"));p.add(zone);p.add(new JLabel("EQ"));p.add(eq);p.add(button("Save",()->{service.settings.facilityZone=zone.getText().trim();service.settings.eqPreset=Objects.toString(eq.getSelectedItem(),"Balanced");service.save();}));return p;'
          if text.count(old) != 1: raise SystemExit('Music EQ combo anchor mismatch')
          text = text.replace(old, new, 1)
          old = '        private JPanel flow(){JPanel p=new JPanel(new FlowLayout(FlowLayout.LEFT,9,10));p.setOpaque(false);return p;}\n        private JButton button(String s,Runnable r){JButton b=new JButton(s);b.addActionListener(e->r.run());return b;}'
          new = '''        private JPanel flow(){JPanel p=new JPanel(new FlowLayout(FlowLayout.LEFT,9,10));p.setOpaque(false);return p;}\n        private void styleCombo(JComboBox<?> combo){combo.setUI(new com.wtm.ui.ThemedComboBoxUI(Theme.active()));combo.setBackground(Theme.panel2());combo.setForeground(Theme.text());combo.setBorder(BorderFactory.createLineBorder(Theme.border()));}\n        private void prepareScroll(JScrollPane scroll,JComponent body){\n            scroll.setHorizontalScrollBarPolicy(ScrollPaneConstants.HORIZONTAL_SCROLLBAR_NEVER);\n            scroll.getHorizontalScrollBar().setEnabled(false);\n            scroll.getViewport().setBackground(Theme.bg());\n            Runnable fit=()->{int width=scroll.getViewport().getExtentSize().width;if(width<=0)width=Math.max(620,scroll.getWidth()-20);Dimension pref=body.getPreferredSize();int height=pref==null?760:Math.max(pref.height,720);body.setMinimumSize(new Dimension(0,height));body.setPreferredSize(new Dimension(Math.max(600,width),height));body.setMaximumSize(new Dimension(Integer.MAX_VALUE,Integer.MAX_VALUE));body.revalidate();};\n            fit.run();\n            scroll.getViewport().addComponentListener(new ComponentAdapter(){@Override public void componentResized(ComponentEvent e){fit.run();}});\n        }\n        private JButton button(String s,Runnable r){JButton b=new JButton(s);b.addActionListener(e->r.run());return b;}'''
          if text.count(old) != 1: raise SystemExit('Music helper anchor mismatch')
          music.write_text(text.replace(old, new, 1), encoding='utf-8')

          lifecycle = Path('src/com/wtm/modular/ui/WorkspaceLifecycleV3.java')
          text = lifecycle.read_text(encoding='utf-8')
          text = text.replace('import com.wtm.ui.ThemedComboBoxUI;\n', '')
          text = text.replace('    private static final String MUSIC_PANEL_CLASS = "com.wtm.modular.ui.MusicModuleGuard$MusicPanel";\n', '')
          text = text.replace('    private static final Set<JScrollPane> MUSIC_SCROLLS =\n            Collections.newSetFromMap(new IdentityHashMap<>());\n', '')
          text = text.replace(' * <p>The key rule is intentionally strict: COMPONENT_ADDED is cosmetic only.\n * Structural work (dynamic sidebar routes, Intelligence and Music dashboard\n * additions) runs only at real lifecycle boundaries: first workspace\n * activation and Settings Save & Apply. This avoids the historical\n * component-add rebuild storms and removes competing recovery guards.</p>\n', ' * <p>Structural work (dynamic sidebar routes, Intelligence and Music dashboard\n * additions) runs only at real lifecycle boundaries: first workspace\n * activation and Settings Save & Apply. Generic component-add lifecycle\n * hooks are deliberately excluded.</p>\n')
          block = '''\n            if (event instanceof ContainerEvent ce && ce.getID() == ContainerEvent.COMPONENT_ADDED) {\n                // COMPONENT_ADDED is cosmetic only: never insert controls or\n                // rebuild routes from a generic component-add callback.\n                polishMusicTree(ce.getChild());\n            }\n'''
          if text.count(block) != 1: raise SystemExit('Workspace container-event block mismatch')
          text = text.replace(block, '\n', 1)
          old_mask = '        }, AWTEvent.WINDOW_EVENT_MASK | AWTEvent.ACTION_EVENT_MASK | AWTEvent.CONTAINER_EVENT_MASK);'
          if text.count(old_mask) != 1: raise SystemExit('Workspace event mask mismatch')
          text = text.replace(old_mask, '        }, AWTEvent.WINDOW_EVENT_MASK | AWTEvent.ACTION_EVENT_MASK);', 1)
          if text.count('        polishMusicTree(frame);\n') != 2: raise SystemExit('Workspace polish call count mismatch')
          text = text.replace('        polishMusicTree(frame);\n', '')
          start = text.find('    /** Cosmetic-only Music workspace normalization. */')
          end = text.find('    private static JCheckBox findCheckBox', start)
          if start < 0 or end < 0: raise SystemExit('Workspace Music cosmetic helper block not found')
          lifecycle.write_text(text[:start] + text[end:], encoding='utf-8')
          PY

          git diff --check
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-music-cleanup $(find src -name '*.java')
          git diff -- src/com/wtm/modular/ui/MusicModuleGuard.java src/com/wtm/modular/ui/WorkspaceLifecycleV3.java

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/modular/ui/MusicModuleGuard.java src/com/wtm/modular/ui/WorkspaceLifecycleV3.java
          git commit -m 'Move Music cosmetics out of global component lifecycle'
          git push origin HEAD:master
