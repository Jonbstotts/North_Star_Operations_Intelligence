name: One-shot Music storage regression gates

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-music-storage-reconcile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gate canonical Music storage ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.sh')
          s=p.read_text()
          anchor='''if grep -qE 'findByName|findMarked' src/com/wtm/app/AiEnabledMain.java src/com/wtm/modular/ui/MusicModuleGuard.java || \\\n   grep -qE 'findMarked|removeMarked|removeNamed' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java; then\n  echo "ERROR: recursive dashboard extension component discovery returned." >&2\n  exit 1\nfi\n\n'''
          insert=anchor+'''# Music settings belong to the canonical application data directory and own\n# their own file hardening. Workspace lifecycle code must not reach through\n# into Music persistence details.\nif ! grep -Fq 'ConfigService.appDataDir().resolve("music.properties")' src/com/wtm/modular/ui/MusicModuleGuard.java || \\\n   ! grep -Fq 'SecureFiles.storePropertiesAtomic(config,p,"NorthStar Music & Audio")' src/com/wtm/modular/ui/MusicModuleGuard.java; then\n  echo "ERROR: Music settings are not using canonical hardened app storage." >&2\n  exit 1\nfi\nif grep -q 'restrictMusicStorage' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java; then\n  echo "ERROR: workspace lifecycle reached into Music storage ownership." >&2\n  exit 1\nfi\n\n'''
          if s.count(anchor)!=1: raise SystemExit('build.sh dashboard gate anchor mismatch')
          p.write_text(s.replace(anchor,insert))
          PY
          git diff --check
          bash build.sh
      - name: Commit Music storage gates
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build.sh
          git commit -m 'Gate canonical Music settings storage'
          git push origin master
