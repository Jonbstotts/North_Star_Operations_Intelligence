name: Build NorthStar GUI RC11

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc11.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC11 source
        uses: actions/checkout@v4
        with:
          ref: 45d6c287db2c74a94be12e0d312ba01df6c03381
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC11
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "45d6c287db2c74a94be12e0d312ba01df6c03381"

          grep -q 'toggleWeatherAlertMenu' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'weatherAlertPopupVisibleAtPress' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'scroll.setViewportBorder(null)' src/com/wtm/ui/OperationsAnnouncementSlidePanel.java
          ! grep -q 'RoundedPanel card=new RoundedPanel' src/com/wtm/ui/OperationsAnnouncementSlidePanel.java

          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'

          for entry in \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png \
            com/wtm/ui/NorthStarDashboardGlyphs.class \
            com/wtm/ui/DashboardGridPanel.class \
            com/wtm/ui/OperationsAnnouncementSlidePanel.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/ui/MainShowcasePanel.class \
            com/wtm/ui/SettingsDialog.class \
            com/wtm/config/AppConfig.class \
            com/wtm/config/ConfigService.class \
            com/wtm/alerts/WeatherAlertPolicy.class \
            com/wtm/alerts/SevereWeatherRefreshPolicy.class; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done

          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC11.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC11-SHA256SUMS.txt
          printf 'RC11_SOURCE_SHA=%s\nRC11_JAR=%s\n' "$(git rev-parse HEAD)" "$OUT" | tee NorthStar-v2.1.34-GUI-RC11-BUILDINFO.txt

      - name: Upload RC11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC11
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC11.jar
            NorthStar-v2.1.34-GUI-RC11-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC11-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
