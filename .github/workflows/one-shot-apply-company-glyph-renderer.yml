name: Apply company dashboard glyph renderer
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-apply-company-glyph-renderer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply source-owned company glyph renderer
        run: python3 ci/patch_dashboard_company_glyphs.py
      - name: Validate build
        run: bash build.sh
      - name: Commit renderer change
        run: |
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java
          git diff --cached --check
          git commit -m 'Make company dashboard glyph atlas authoritative'
          git push origin master
