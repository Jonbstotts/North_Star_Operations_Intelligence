          '''    private static String videoExtension(String filename){\n        int dot=filename.lastIndexOf('.');\n        if(dot<0)return null;\n        String ext=filename.substring(dot).toLowerCase(Locale.ROOT);\n        return Set.of(".mp4",".mov").contains(ext)?ext:null;\n    }\n\n    private static String extension(String filename){''')

          p=Path('src/com/wtm/ui/ThemedFileChooser.java'); s=p.read_text()
          s=s.replace('import javax.swing.*;','import javax.swing.*;\nimport javax.swing.filechooser.FileNameExtensionFilter;',1)
