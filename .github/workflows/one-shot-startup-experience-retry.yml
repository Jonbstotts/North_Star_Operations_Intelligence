          '''    private AppTheme currentSettingsTheme(){\n        AppTheme selected=(AppTheme)themeSelector.getSelectedItem();\n        return selected==null?AppTheme.fromId(cfg.themeId):selected;\n    }''')

          p=Path('THIRD_PARTY_NOTICES.md')
          p.write_text(p.read_text().rstrip()+'''\n\nNorth Star Operations Intelligence also redistributes JCodec and JCodec JavaSE, version 0.2.5.\n\nJCodec is licensed under the FreeBSD License. Project: https://github.com/jcodec/jcodec\n''')
