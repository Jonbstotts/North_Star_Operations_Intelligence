          cat > src/com/wtm/ui/StartupExperienceManager.java <<'JAVA'
          package com.wtm.ui;

          import com.wtm.config.AppConfig;
          import com.wtm.media.MediaCategory;
          import com.wtm.media.MediaService;
          import com.wtm.security.AuditService;
          import org.jcodec.api.FrameGrab;
          import org.jcodec.common.io.NIOUtils;
          import org.jcodec.common.io.SeekableByteChannel;
          import org.jcodec.common.model.Picture;
          import org.jcodec.scale.AWTUtil;
          import javax.swing.*;
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.nio.file.Path;
          import java.util.concurrent.atomic.AtomicBoolean;

          /** Source-owned optional managed startup intro. Visual track only in v1. */
          public final class StartupExperienceManager {
              private StartupExperienceManager(){}

              public static boolean playIntroIfConfigured(AppConfig config,Runnable completion){
                  if(config==null||!"INTRO_VIDEO".equalsIgnoreCase(config.startupExperience))return false;
                  Path video=MediaService.resolve(MediaCategory.STARTUP_MEDIA,config.startupVideoAsset);
                  if(video==null)return false;
                  IntroWindow window=new IntroWindow(video,completion==null?()->{}:completion);
                  window.setVisible(true);
                  window.start();
                  return true;
              }

              private static final class IntroWindow extends JWindow {
                  private final Path video;
                  private final Runnable completion;
                  private final VideoPanel videoPanel=new VideoPanel();
                  private final AtomicBoolean finished=new AtomicBoolean(false);
                  private volatile boolean stopRequested;

                  IntroWindow(Path video,Runnable completion){
                      this.video=video;this.completion=completion;
                      setBackground(Color.BLACK);setAlwaysOnTop(true);
                      setBounds(GraphicsEnvironment.getLocalGraphicsEnvironment().getMaximumWindowBounds());
                      JPanel root=new JPanel(new BorderLayout());root.setBackground(Color.BLACK);
                      root.add(videoPanel,BorderLayout.CENTER);
                      JButton skip=new JButton("Skip Intro");skip.addActionListener(e->finish());
                      JPanel controls=new JPanel(new FlowLayout(FlowLayout.RIGHT,16,12));
                      controls.setOpaque(false);controls.add(skip);root.add(controls,BorderLayout.SOUTH);
                      setContentPane(root);
                      getRootPane().registerKeyboardAction(e->finish(),KeyStroke.getKeyStroke("ESCAPE"),
                              JComponent.WHEN_IN_FOCUSED_WINDOW);
                      ApplicationBrand.applyWindowIcon(this);
                  }

                  void start(){Thread t=new Thread(this::decodeLoop,"northstar-startup-video");t.setDaemon(true);t.start();}

                  private void decodeLoop(){
                      SeekableByteChannel channel=null;
                      try{
                          channel=NIOUtils.readableChannel(video.toFile());
                          FrameGrab grab=FrameGrab.createFrameGrab(channel);
                          long next=System.nanoTime();
                          while(!stopRequested){
                              Picture picture=grab.getNativeFrame();if(picture==null)break;
                              BufferedImage frame=AWTUtil.toBufferedImage(picture);
                              SwingUtilities.invokeAndWait(()->videoPanel.setFrame(frame));
                              next+=33_333_333L;
                              long remaining=next-System.nanoTime();
                              if(remaining>0)Thread.sleep(remaining/1_000_000L,(int)(remaining%1_000_000L));
                              else next=System.nanoTime();
                          }
                      }catch(Throwable ex){
                          AuditService.record("Startup intro playback failed: "+ex.getClass().getSimpleName());
                      }finally{
                          NIOUtils.closeQuietly(channel);
                          SwingUtilities.invokeLater(this::finish);
                      }
                  }

                  private void finish(){
                      if(!finished.compareAndSet(false,true))return;
                      stopRequested=true;setVisible(false);dispose();completion.run();
                  }
              }

              private static final class VideoPanel extends JPanel {
                  private BufferedImage frame;
                  VideoPanel(){setBackground(Color.BLACK);}
                  void setFrame(BufferedImage next){frame=next;repaint();}
                  @Override protected void paintComponent(Graphics graphics){
                      super.paintComponent(graphics);BufferedImage image=frame;if(image==null)return;
                      double scale=Math.min(getWidth()/(double)image.getWidth(),getHeight()/(double)image.getHeight());
                      int dw=Math.max(1,(int)Math.round(image.getWidth()*scale));
                      int dh=Math.max(1,(int)Math.round(image.getHeight()*scale));
                      Graphics2D g=(Graphics2D)graphics.create();
                      try{
                          g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BILINEAR);
                          g.drawImage(image,(getWidth()-dw)/2,(getHeight()-dh)/2,dw,dh,null);
                      }finally{g.dispose();}
                  }
              }
          }
          JAVA

          cat > src/com/wtm/app/Main.java <<'JAVA'
          package com.wtm.app;

          import com.wtm.config.*;
          import com.wtm.security.*;
          import com.wtm.ui.*;
          import com.wtm.employee.EmployeeService;
          import com.wtm.callin.CallInServerManager;
          import javax.swing.*;

          /** North Star Operations Intelligence desktop application entry point. */
          public final class Main {
              private Main(){}
              public static void main(String[] args){
                  System.setProperty("apple.awt.application.name","North Star Operations");
                  System.setProperty("apple.awt.application.appearance","system");
                  SwingUtilities.invokeLater(()->{
                      AppTheme bootTheme=AppTheme.fromId(ConfigService.peekThemeId());
                      Theme.setActive(bootTheme.id());ApplicationBrand.applyApplicationIcon();
                      String bootExperience=ConfigService.peekStartupExperience();
                      NorthStarSplashScreen splash="STATIC_SPLASH".equals(bootExperience)?new NorthStarSplashScreen():null;
                      if(splash!=null){splash.setVisible(true);splash.updateProgress(18,"Loading secure application configuration...");}
                      SwingWorker<AppConfig,Void> loader=new SwingWorker<>(){
                          @Override protected AppConfig doInBackground(){
                              if(splash!=null)splash.updateProgress(42,"Initializing data providers and local storage...");
                              return ConfigService.load();
                          }
                          @Override protected void done(){
                              try{
                                  AppConfig config=get();prepareConfiguration(config);
                                  AppTheme theme=HolidayThemeService.effectiveTheme(config,java.time.LocalDate.now());
                                  config.darkMode=theme.dark();Theme.setActive(theme.id());CallInServerManager.apply(config);
                                  if(splash!=null)splash.updateProgress(72,"Preparing secure user session...");
                                  Runnable next=()->continueAfterStartupPresentation(config,theme);
                                  if("INTRO_VIDEO".equalsIgnoreCase(config.startupExperience)){
                                      if(splash!=null)splash.closeSplash();
                                      if(!StartupExperienceManager.playIntroIfConfigured(config,next))next.run();
                                      return;
                                  }
                                  if(splash!=null){
                                      splash.updateProgress(100,"North Star ready.");
                                      Timer timer=new Timer(650,e->{((Timer)e.getSource()).stop();splash.closeSplash();next.run();});
                                      timer.setRepeats(false);timer.start();return;
                                  }
                                  next.run();
                              }catch(Exception ex){
                                  if(splash!=null)splash.closeSplash();
                                  ThemedDialogs.message(null,"North Star could not complete startup. Review the local configuration and try again.",
                                          "Startup Error",ThemedDialogs.Kind.ERROR);
                              }
                          }
                      };loader.execute();
                  });
              }

              private static void prepareConfiguration(AppConfig config){
                  boolean migrated=EmployeeService.migrateLegacyCelebrationsIfNeeded(config);
                  EmployeeService.syncCelebrations(config,EmployeeService.loadForSystem());
                  if(migrated)ConfigService.save(config);
              }
              private static void continueAfterStartupPresentation(AppConfig config,AppTheme theme){
                  if(!UserService.hasUsers()){
                      UserAccount initial=AuthService.hasPassword()?LegacyAdminMigrationDialog.migrate(null,theme):FirstAdminDialog.create(null,theme);
                      if(initial==null)return;SessionManager.login(initial);
                  }
                  continueStartup(config,theme);
              }
              private static void continueStartup(AppConfig config,AppTheme theme){
                  if(config.loginRequiredOnStartup&&!SessionManager.isAuthenticated()){
                      UserAccount account=UserLoginDialog.authenticate(null,"North Star Login",
                              "Sign in to continue to the operations dashboard.",theme,"");
                      if(account==null)return;SessionManager.login(account);
                  }
                  OperationsWorkspaceFrame frame=new OperationsWorkspaceFrame(config);frame.setVisible(true);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.sh');s=p.read_text()
          old='''if [ ! -f lib/flatlaf-3.7.2.jar ] || [ ! -f lib/flatlaf-intellij-themes-3.7.2.jar ]; then\n  echo "ERROR: required FlatLaf 3.7.2 runtime libraries are missing from lib/." >&2\n  exit 1\nfi\n'''
          new=old+'''if [ ! -f lib/jcodec-0.2.5.jar ] || [ ! -f lib/jcodec-javase-0.2.5.jar ]; then\n  echo "ERROR: required JCodec 0.2.5 startup-video libraries are missing from lib/." >&2\n  exit 1\nfi\nif [ ! -f src/com/wtm/ui/StartupExperienceManager.java ] || ! grep -Fq 'peekStartupExperience' src/com/wtm/config/ConfigService.java; then\n  echo "ERROR: canonical optional startup-experience ownership is missing." >&2\n  exit 1\nfi\n'''
          if old not in s: raise SystemExit('build dependency anchor missing')
          s=s.replace(old,new,1)
          old='''for dep in lib/flatlaf-3.7.2.jar lib/flatlaf-intellij-themes-3.7.2.jar; do\n  (cd out && jar --extract --file "../$dep")\ndone'''
          new='''for dep in lib/flatlaf-3.7.2.jar lib/flatlaf-intellij-themes-3.7.2.jar lib/jcodec-0.2.5.jar lib/jcodec-javase-0.2.5.jar; do\n  (cd out && jar --extract --file "../$dep")\ndone'''
          if old not in s: raise SystemExit('build extraction anchor missing')
          p.write_text(s.replace(old,new,1))
          PY

