name: Build NorthStar GUI RC10

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc10.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC10 source
        uses: actions/checkout@v4
        with:
          ref: 14632be4efaf4a2b63cc0fdb69810063608ce3c4
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC10
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "14632be4efaf4a2b63cc0fdb69810063608ce3c4"

          # Retrospective repair invariants.
          ! grep -R -q --include='*.java' -E 'mapWidthPercent|FixedRatioLayout|setAutomaticSevereWeatherActive' src
          ! grep -q 'Map / Information Layout' src/com/wtm/ui/SettingsDialog.java
          grep -q 'WeatherAlertPolicy' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'SevereWeatherRefreshPolicy' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'setSevereWeatherActive' src/com/wtm/ui/MainShowcasePanel.java
          grep -q 'workspaceKpiMovementMode' src/com/wtm/config/AppConfig.java
          grep -q 'workspace.kpis.movementMode' src/com/wtm/config/ConfigService.java
          grep -q 'stopOperationsMovement();' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -q 'DashboardGridMigrationSmokeTest.java' build.sh
          grep -q 'WeatherAlertPolicySmokeTest.java' build.sh
          grep -q 'ConfigRoundTripSmokeTest.java' build.sh

          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'

          for entry in \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png \
            com/wtm/ui/NorthStarDashboardGlyphs.class \
            com/wtm/ui/DashboardGridPanel.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/ui/MainShowcasePanel.class \
            com/wtm/ui/SettingsDialog.class \
            com/wtm/config/AppConfig.class \
            com/wtm/config/ConfigService.class \
            com/wtm/alerts/WeatherAlertPolicy.class \
            com/wtm/alerts/SevereWeatherRefreshPolicy.class; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done

          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC10.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC10-SHA256SUMS.txt
          printf 'RC10_SOURCE_SHA=%s\nRC10_JAR=%s\n' "$(git rev-parse HEAD)" "$OUT" | tee NorthStar-v2.1.34-GUI-RC10-BUILDINFO.txt

      - name: Upload RC10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC10
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC10.jar
            NorthStar-v2.1.34-GUI-RC10-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC10-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
