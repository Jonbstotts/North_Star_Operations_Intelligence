name: Build v2.1.34 GUI regression candidate
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-shot-v2.1.34-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build validated GUI regression candidate
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1.jar > NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1-SHA256SUMS.txt
          unzip -p NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1.jar META-INF/MANIFEST.MF
      - name: Upload GUI regression candidate
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC1
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1.jar
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC1-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
