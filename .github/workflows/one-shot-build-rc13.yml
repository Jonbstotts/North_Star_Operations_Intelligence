name: Build NorthStar GUI RC13

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc13.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC13 source
        uses: actions/checkout@v4
        with:
          ref: b0f8c0150601050680da08a3f0ae1b399c4f569c
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC13
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b0f8c0150601050680da08a3f0ae1b399c4f569c"
          test -f src/com/wtm/ui/ContinuousTickerGeometry.java
          grep -Fq 'UIManager.getLookAndFeelDefaults()' src/com/wtm/ui/ThemeManager.java
          ! grep -Fq 'informationTickerTrack.add(Box.createHorizontalStrut' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -Fq 'operationsTickerTrack.add(Box.createHorizontalStrut' src/com/wtm/ui/OperationsWorkspaceFrame.java

          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'

          for entry in \
            com/wtm/ui/ContinuousTickerGeometry.class \
            com/wtm/ui/ThemeManager.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/map/BasemapProvider.class \
            com/wtm/alerts/WeatherAlertPolicy.class \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done

          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC13.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC13-SHA256SUMS.txt
          printf 'RC13_SOURCE_SHA=%s\nRC13_JAR=%s\nTICKER_GEOMETRY=SEAMLESS_EQUAL_SLOTS\nTHEME_OVERLAY_SCOPE=LOOK_AND_FEEL_DEFAULTS\nBASEMAP_PROVIDER=OPENSTREETMAP\n' \
            "$(git rev-parse HEAD)" "$OUT" | tee NorthStar-v2.1.34-GUI-RC13-BUILDINFO.txt

      - name: Upload RC13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC13
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC13.jar
            NorthStar-v2.1.34-GUI-RC13-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC13-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
