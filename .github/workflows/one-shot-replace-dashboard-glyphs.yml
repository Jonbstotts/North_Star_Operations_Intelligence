name: Replace dashboard glyphs with supplied NorthStar artwork
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-replace-dashboard-glyphs.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Replace generic event glyph fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          s=path.read_text()
          old='''    private Icon eventTagIcon(OperationEvent event,int size){
        Icon supplied=NorthStarDashboardGlyphs.icon(eventDashboardGlyphKey(event),size);
        if(supplied!=null)return supplied;
        String assetKey=eventGlyphAssetKey(event);
        Icon approved=WorkspaceGlyphs.icon(assetKey,size,Theme.text());
        if(approved!=null)return approved;'''
          new='''    private Icon eventTagIcon(OperationEvent event,int size){
        Icon supplied=NorthStarDashboardGlyphs.icon(eventDashboardGlyphKey(event),size);
        if(supplied!=null)return supplied;
        return NorthStarDashboardGlyphs.icon("special_event",size);'''
          if old not in s:
              raise SystemExit('event glyph fallback anchor not found')
          s=s.replace(old,new,1)
          # Remove now-unreachable legacy fallback body up to the method's final return.
          start=s.index('        return NorthStarDashboardGlyphs.icon("special_event",size);')+len('        return NorthStarDashboardGlyphs.icon("special_event",size);')
          end=s.index('\n    }',start)
          s=s[:start]+s[end:]

          old='''        Icon supplied=NorthStarDashboardGlyphs.icon(dashboardKey,size);
        if(supplied!=null)return supplied;
        String assetKey=type.contains("anniversary")
                ?"confetti"
                :type.contains("employee of the month")
                    ?"toast"
                    :type.contains("promotion")
                        ?"rising"
                        :"gift";
        Icon approved=WorkspaceGlyphs.icon(assetKey,size,Theme.text());
        if(approved!=null)return approved;'''
          new='''        Icon supplied=NorthStarDashboardGlyphs.icon(dashboardKey,size);
        if(supplied!=null)return supplied;
        return NorthStarDashboardGlyphs.icon("lets_celebrate",size);'''
          if old not in s:
              raise SystemExit('celebration glyph fallback anchor not found')
          s=s.replace(old,new,1)
          start=s.index('        return NorthStarDashboardGlyphs.icon("lets_celebrate",size);')+len('        return NorthStarDashboardGlyphs.icon("lets_celebrate",size);')
          end=s.index('\n    }',start)
          s=s[:start]+s[end:]
          path.write_text(s)
          PY
          git diff --check
          bash build.sh
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java
          git commit -m 'Make NorthStar dashboard glyph atlas authoritative'
          git push origin master
