name: Fix brand resource packaging
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-fix-brand-packaging.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Repair brand resource packaging and validate startup assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/brand
          cp brand/northstar_primary_logo_exact.png resources/brand/
          cp brand/northstar_splash_exact.png resources/brand/
          cp brand/northstar_app_icon_exact.png resources/brand/
          if ! grep -Fq 'brand/northstar_primary_logo_exact.png' build.sh; then
            marker='rm -rf out'
            python3 - <<'PY'
          from pathlib import Path
          p=Path('build.sh')
          s=p.read_text()
          needle='echo "Built NorthStarOperations.jar from canonical master src tree"'
          check='''\n# Runtime branding is mandatory. NorthStarBrand loads these classpath resources\n# during application startup, so a release JAR without them is not launchable.\nfor resource in \\\n  brand/northstar_primary_logo_exact.png \\\n  brand/northstar_splash_exact.png \\\n  brand/northstar_app_icon_exact.png; do\n  if ! jar tf NorthStarOperations.jar | grep -Fxq "$resource"; then\n    echo "ERROR: packaged JAR is missing required runtime resource: $resource" >&2\n    exit 1\n  fi\ndone\n'''
          if needle not in s:
              raise SystemExit('build completion marker not found')
          s=s.replace(needle,check+'\n'+needle,1)
          p.write_text(s)
          PY
          fi
          bash build.sh
          for r in brand/northstar_primary_logo_exact.png brand/northstar_splash_exact.png brand/northstar_app_icon_exact.png; do
            jar tf NorthStarOperations.jar | grep -Fx "$r"
          done
          git diff --check
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build.sh resources/brand
          git commit -m 'Package mandatory North Star brand resources'
          git push origin master
