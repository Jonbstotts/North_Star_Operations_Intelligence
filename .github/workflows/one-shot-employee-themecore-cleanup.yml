name: One-shot Employee ThemeCore ownership cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-employee-themecore-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Move Employee presentation ownership into EmployeeOperationsPanel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          employee=Path('src/com/wtm/ui/EmployeeOperationsPanel.java')
          text=employee.read_text(encoding='utf-8')
          old='''        JLabel heading=new JLabel("Employee Operations");\n        heading.setFont(new Font(Font.SANS_SERIF,Font.BOLD,22));\n\n        JLabel description=new JLabel(\n                "<html>Management-only employee system of record for identity, "\n                +"recognition, qualifications, attendance/call-ins, performance "\n                +"and daily assignment eligibility.</html>"\n        );\n        description.setFont(new Font(Font.SANS_SERIF,Font.PLAIN,11));\n\n        JPanel header=new JPanel();\n        header.setOpaque(false);\n        header.setLayout(new BoxLayout(header,BoxLayout.Y_AXIS));\n        header.add(heading);\n        header.add(Box.createVerticalStrut(3));\n        header.add(description);\n        add(header,BorderLayout.NORTH);'''
          new='''        JLabel description=new JLabel(\n                "<html>Management-only employee system of record for identity, "\n                +"recognition, qualifications, attendance/call-ins, performance "\n                +"and daily assignment eligibility.</html>"\n        );\n        description.setFont(new Font(Font.SANS_SERIF,Font.PLAIN,11));\n        add(description,BorderLayout.NORTH);'''
          if text.count(old)!=1:
              raise SystemExit(f'Employee header anchor mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          old='''        employeeTable.setRowHeight(28);\n        employeeTable.setSelectionMode(ListSelectionModel.SINGLE_SELECTION);'''
          new='''        employeeTable.setRowHeight(28);\n        employeeTable.setSelectionMode(ListSelectionModel.SINGLE_SELECTION);\n        hideDirectoryColumn("Employee #");\n        hideDirectoryColumn("Department");\n        hideDirectoryColumn("Shift");\n        try{\n            employeeTable.getColumn("Name").setPreferredWidth(210);\n            var activeColumn=employeeTable.getColumn("Active");\n            activeColumn.setMinWidth(70);\n            activeColumn.setPreferredWidth(80);\n            activeColumn.setMaxWidth(95);\n        }catch(IllegalArgumentException ignored){}'''
          if text.count(old)!=1:
              raise SystemExit(f'Employee directory anchor mismatch: {text.count(old)}')
          text=text.replace(old,new,1)

          marker='''    private JComponent buildEmployeeWorkspace(){'''
          helper='''    private void hideDirectoryColumn(String name){\n        try{ employeeTable.removeColumn(employeeTable.getColumn(name)); }\n        catch(IllegalArgumentException ignored){}\n    }\n\n'''
          if text.count(marker)!=1:
              raise SystemExit(f'Employee workspace marker mismatch: {text.count(marker)}')
          text=text.replace(marker,helper+marker,1)
          employee.write_text(text,encoding='utf-8')

          core=Path('src/com/wtm/ui/ThemeCoreV216.java')
          text=core.read_text(encoding='utf-8')
          text=text.replace('import javax.swing.table.TableColumn;\n','')
          text=text.replace('import java.util.ArrayList;\n','')
          text=text.replace('import java.util.List;\n','')
          text=text.replace('    private static final String EMPLOYEE_PANEL_CLASS="com.wtm.ui.EmployeeOperationsPanel";\n\n','')
          text=text.replace('        normalizeEmployeeOperations(component);\n','')
          start=text.find('    /** Employee page compact directory treatment owned by the shared UI core. */')
          end=text.find('    private static Container findContainerContainingText(',start)
          if start<0 or end<0:
              raise SystemExit('ThemeCore Employee normalization block not found')
          text=text[:start]+text[end:]

          for signature in [
              '    private static List<JLabel> labels(Container root)',
              '    private static <T extends Component> T findFirst(Container root,Class<T> type)',
              '    private static <T extends Component> List<T> findAll(Component root,Class<T> type)',
              '    private static <T extends Component> void collect(Component root,Class<T> type,List<T> out)',
              '    private static Component findByClass(Component root,String className)'
          ]:
              if signature in text:
                  raise SystemExit(f'Unexpected leftover helper after block removal: {signature}')
          core.write_text(text,encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'EMPLOYEE_PANEL_CLASS' src/com/wtm/ui/ThemeCoreV216.java
          ! grep -q 'normalizeEmployeeOperations' src/com/wtm/ui/ThemeCoreV216.java
          ! grep -q 'compactDirectory' src/com/wtm/ui/ThemeCoreV216.java
          grep -q 'hideDirectoryColumn("Employee #")' src/com/wtm/ui/EmployeeOperationsPanel.java
          grep -q 'split.setDividerSize(0)' src/com/wtm/ui/EmployeeOperationsPanel.java
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-employee-core $(find src -name '*.java')
          git diff -- src/com/wtm/ui/EmployeeOperationsPanel.java src/com/wtm/ui/ThemeCoreV216.java
      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/EmployeeOperationsPanel.java src/com/wtm/ui/ThemeCoreV216.java
          git commit -m 'Move Employee presentation ownership out of ThemeCore'
          git push origin HEAD:master
