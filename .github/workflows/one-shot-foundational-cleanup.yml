name: NorthStar foundational recent-fix cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-foundational-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture patcher diagnostic
        shell: bash
        run: |
          set +e
          python3 ci/one_shot_foundational_cleanup.py > ci/foundation_cleanup_diagnostic.log 2>&1
          RC=$?
          echo "PATCH_EXIT=$RC" >> ci/foundation_cleanup_diagnostic.log
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/foundation_cleanup_diagnostic.log
          git commit -m 'Capture foundational cleanup diagnostic'
          git push origin HEAD:master
          exit 0
