name: Holiday theme persistence shell fix
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-holiday-theme-persistence-shell.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch persistence load
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/cfg\.themeId=p\.getProperty\("themeId",cfg\.themeId\);\n            AppTheme selectedTheme=/cfg.themeId=p.getProperty("themeId",cfg.themeId);\n            cfg.automaticHolidayThemes=bool(\n                    p,"automaticHolidayThemes",cfg.automaticHolidayThemes);\n            AppTheme selectedTheme=/' src/com/wtm/config/ConfigService.java
          grep -Fq 'p,"automaticHolidayThemes",cfg.automaticHolidayThemes' src/com/wtm/config/ConfigService.java
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
          git diff --check
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/config/ConfigService.java
          git commit -m 'Persist automatic holiday theme preference'
          git push origin master
