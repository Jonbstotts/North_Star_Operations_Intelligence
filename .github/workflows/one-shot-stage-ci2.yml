name: Stage FlatLaf CI 2
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-shot-stage-ci2.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Generate staged CI
        run: python3 ci/stage_flatlaf_ci.py
      - name: Commit staged CI
        shell: bash
        run: |
          set -e
          git config user.name "NorthStar Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci/build-next.yml
          git commit -m "Stage FlatLaf-aware canonical CI"
          git push origin master
