name: Build NorthStar GUI RC14

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc14.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC14 source
        uses: actions/checkout@v4
        with:
          ref: bbc491753ab66907c9079307f7cb13a38ee5b02b
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC14
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bbc491753ab66907c9079307f7cb13a38ee5b02b"
          ! grep -Fq 'new JCheckBox("Custom Information Blocks")' src/com/wtm/ui/SettingsDialog.java
          grep -Fq 'controls.add(controlContent, BorderLayout.NORTH)' src/com/wtm/ui/DataCollectionPanel.java
          grep -Fq 'cfg.workspaceInfoStripEnabled=true;' src/com/wtm/config/ConfigService.java
          grep -Fq 'Information is a core dashboard row' src/com/wtm/ui/OperationsWorkspaceFrame.java

          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'

          for entry in \
            com/wtm/ui/DataCollectionPanel.class \
            com/wtm/ui/SettingsDialog.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/ui/ContinuousTickerGeometry.class \
            com/wtm/ui/ThemeManager.class \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done

          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC14.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC14-SHA256SUMS.txt
          printf 'RC14_SOURCE_SHA=%s\nRC14_JAR=%s\nDATA_IMPORT_LAYOUT=TOP_ANCHORED\nINFORMATION_ROW=CORE_ALWAYS_ACTIVE\nTHEME_OVERLAY_SCOPE=LOOK_AND_FEEL_DEFAULTS\nTICKER_GEOMETRY=SEAMLESS_EQUAL_SLOTS\nBASEMAP_PROVIDER=OPENSTREETMAP\n' \
            "$(git rev-parse HEAD)" "$OUT" | tee NorthStar-v2.1.34-GUI-RC14-BUILDINFO.txt

      - name: Upload RC14 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC14
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC14.jar
            NorthStar-v2.1.34-GUI-RC14-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC14-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
