          cat > src/com/wtm/ui/ThemeManager.java <<'EOF'
          package com.wtm.ui;

          import com.formdev.flatlaf.*;
          import com.formdev.flatlaf.intellijthemes.*;

          import javax.swing.*;
          import java.awt.*;

          /**
           * Single owner for installing the Swing look-and-feel. Real FlatLaf
           * themes own ordinary controls; North Star only layers brand semantics.
           */
          public final class ThemeManager {
              private ThemeManager(){}

              public static void install(AppTheme theme){
                  AppTheme resolved=theme==null?AppTheme.NORTH_STAR:theme;
                  boolean installed=switch(resolved){
                      case FLATLAF_LIGHT->FlatLightLaf.setup();
                      case FLATLAF_DARK->FlatDarkLaf.setup();
                      case FLATLAF_INTELLIJ->FlatIntelliJLaf.setup();
                      case FLATLAF_DARCULA->FlatDarculaLaf.setup();
                      case ARC->FlatArcIJTheme.setup();
                      case ARC_DARK->FlatArcDarkIJTheme.setup();
                      case CARBON->FlatCarbonIJTheme.setup();
                      case COBALT_2->FlatCobalt2IJTheme.setup();
                      case DRACULA->FlatDraculaIJTheme.setup();
                      case NORD->FlatNordIJTheme.setup();
                      case ONE_DARK->FlatOneDarkIJTheme.setup();
                      case SOLARIZED_LIGHT->FlatSolarizedLightIJTheme.setup();
                      case SOLARIZED_DARK->FlatSolarizedDarkIJTheme.setup();
                      case GRADIANTO_MIDNIGHT->FlatGradiantoMidnightBlueIJTheme.setup();
                      case GRADIANTO_NATURE->FlatGradiantoNatureGreenIJTheme.setup();
                      case ARC_DARK_ORANGE->FlatArcDarkOrangeIJTheme.setup();
                      case HIGH_CONTRAST->FlatHighContrastIJTheme.setup();
                      case CHRISTMAS->FlatArcDarkIJTheme.setup();
                      case HALLOWEEN->FlatDarkPurpleIJTheme.setup();
                      case THANKSGIVING->FlatArcDarkOrangeIJTheme.setup();
                      case INDEPENDENCE->FlatCobalt2IJTheme.setup();
                      case VALENTINE->FlatLightFlatIJTheme.setup();
                      case ST_PATRICKS->FlatGradiantoNatureGreenIJTheme.setup();
                      case WINTER_FROST->FlatCyanLightIJTheme.setup();
                      case NORTH_STAR->FlatDarculaLaf.setup();
                  };
                  if(!installed)FlatDarkLaf.setup();
                  if(resolved.branded())applyBrandOverlay(resolved);
              }

              public static void refresh(Component root){
                  if(root==null)return;
                  if(root instanceof JComponent component)
                      SwingUtilities.updateComponentTreeUI(component);
                  else if(root instanceof Window window)
                      SwingUtilities.updateComponentTreeUI(window);
              }

              public static Color uiColor(String key,Color fallback){
                  Color value=UIManager.getColor(key);
                  return value==null?fallback:value;
              }

              private static void applyBrandOverlay(AppTheme theme){
                  UIManager.put("Component.accentColor",theme.accent());
                  UIManager.put("Component.focusColor",theme.accent());
                  UIManager.put("TabbedPane.underlineColor",theme.accent());
                  UIManager.put("ProgressBar.foreground",theme.accent());
                  UIManager.put("TextComponent.selectionBackground",theme.accent());
                  UIManager.put("Table.selectionBackground",theme.accent());
                  UIManager.put("List.selectionBackground",theme.accent());
                  UIManager.put("Panel.background",theme.bg());
                  UIManager.put("Label.foreground",theme.text());
              }
          }
          EOF

          cat > src/com/wtm/ui/Theme.java <<'EOF'
          package com.wtm.ui;

          import java.awt.*;

          /** Central semantic-color facade backed by the installed FlatLaf. */
          public final class Theme {
              private Theme() {}

              private static volatile AppTheme active=AppTheme.NORTH_STAR;

              public static synchronized void setActive(String id){
                  active=AppTheme.fromId(id);
                  ThemeManager.install(active);
              }
              public static AppTheme active(){return active;}

              public static Color bg(){return ThemeManager.uiColor("Panel.background",active.bg());}
              public static Color panel(){return ThemeManager.uiColor("Panel.background",active.panel());}
              public static Color panel2(){return ThemeManager.uiColor("TextField.background",active.panel2());}
              public static Color border(){return ThemeManager.uiColor("Component.borderColor",active.border());}
              public static Color text(){return ThemeManager.uiColor("Label.foreground",active.text());}
              public static Color muted(){return ThemeManager.uiColor("Label.disabledForeground",active.muted());}
              public static Color accent(){return ThemeManager.uiColor("Component.accentColor",active.accent());}

              public static Color bg(boolean dark){return dark?AppTheme.FLATLAF_DARK.bg():AppTheme.FLATLAF_LIGHT.bg();}
              public static Color panel(boolean dark){return dark?AppTheme.FLATLAF_DARK.panel():AppTheme.FLATLAF_LIGHT.panel();}
              public static Color panel2(boolean dark){return dark?AppTheme.FLATLAF_DARK.panel2():AppTheme.FLATLAF_LIGHT.panel2();}
              public static Color border(boolean dark){return dark?AppTheme.FLATLAF_DARK.border():AppTheme.FLATLAF_LIGHT.border();}
              public static Color text(boolean dark){return dark?AppTheme.FLATLAF_DARK.text():AppTheme.FLATLAF_LIGHT.text();}
              public static Color muted(boolean dark){return dark?AppTheme.FLATLAF_DARK.muted():AppTheme.FLATLAF_LIGHT.muted();}

              public static Color good(){ return new Color(54,177,91); }
              public static Color warn(){ return new Color(242,177,30); }
              public static Color danger(){ return new Color(229,72,77); }
              public static Color sun(){ return new Color(255,183,0); }
              public static Color cloud(){ return new Color(179,215,232); }
              public static Color rain(){ return new Color(60,151,229); }

              public static String hex(Color c){
                  return String.format("#%02x%02x%02x",c.getRed(),c.getGreen(),c.getBlue());
              }
          }
          EOF

          cat > src/com/wtm/ui/ThemeStyler.java <<'EOF'
          package com.wtm.ui;

          import javax.swing.*;
          import javax.swing.border.EmptyBorder;
          import java.awt.*;

          /**
           * Applies only North Star application-specific presentation. FlatLaf
           * owns standard Swing controls, popups, fields, tabs, tables and lists.
           */
          public final class ThemeStyler {
              private ThemeStyler(){}

              public static void apply(Component component,AppTheme theme){
                  if(component==null)return;
                  AppTheme resolved=theme==null?Theme.active():theme;
                  ThemeManager.refresh(component);
                  applyApplicationPresentation(component,resolved);
              }

              private static void applyApplicationPresentation(Component component,AppTheme theme){
                  if(component instanceof JDialog dialog && dialog.getRootPane()!=null){
                      dialog.getRootPane().putClientProperty(
                              "apple.awt.windowAppearance",
                              theme.dark()?"NSAppearanceNameDarkAqua":"NSAppearanceNameAqua");
                  }

                  if(component instanceof JButton button){
                      if(isSidebarRouteButton(button)){
                          button.setFocusPainted(false);
                          button.setFocusable(false);
                          button.setOpaque(false);
                          button.setContentAreaFilled(false);
                          button.setBorderPainted(false);
                          button.setBorder(new EmptyBorder(9,12,9,12));
                      }else if(Boolean.TRUE.equals(button.getClientProperty("primaryAction"))){
                          button.setBackground(Theme.accent());
                          button.setForeground(readableText(Theme.accent()));
                      }
                  }else if(component instanceof RoundedPanel rounded){
                      rounded.setBackground(Theme.panel());
                      rounded.putClientProperty("outlineColor",Theme.border());
                  }else if(component instanceof JScrollPane scroll){
                      scroll.getVerticalScrollBar().setUnitIncrement(18);
                      scroll.getHorizontalScrollBar().setUnitIncrement(18);
                  }

                  if(component instanceof Container container)
                      for(Component child:container.getComponents())
                          applyApplicationPresentation(child,theme);
              }

              private static boolean isSidebarRouteButton(JButton button){
                  return Boolean.TRUE.equals(button.getClientProperty("northstar.sidebar.route"));
              }

              private static Color readableText(Color background){
                  if(background==null)return Color.WHITE;
                  double luminance=(0.2126*background.getRed())
                          +(0.7152*background.getGreen())
                          +(0.0722*background.getBlue());
                  return luminance>150?new Color(20,22,24):Color.WHITE;
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/com/wtm/ui/HolidayThemeService.java')
          s=p.read_text().replace('return AppTheme.DARK;','return AppTheme.FLATLAF_DARK;')
          s=s.replace('temp.themeId="DARK";','temp.themeId="FLATLAF_DARK";')
          s=s.replace('resolved==AppTheme.DARK','resolved==AppTheme.FLATLAF_DARK')
          p.write_text(s)

          p=Path('src/com/wtm/ui/SettingsDialog.java')
          s=p.read_text()
          s=s.replace('"<html>"+HolidayThemeService.automaticThemeDescription(LocalDate.now())\n              + ". North Star remains the base interface outside automatic holiday windows.</html>"',
                      '"<html>"+HolidayThemeService.automaticThemeDescription(LocalDate.now())\n              + ". Your selected FlatLaf theme remains the base interface outside automatic holiday windows.</html>"')
          p.write_text(s)

          p=Path('build.sh')
          s=p.read_text()
          anchor='''if [ ! -f lib/flatlaf-3.7.2.jar ] || [ ! -f lib/flatlaf-intellij-themes-3.7.2.jar ]; then\n'''
          gate='''# Real FlatLaf owns ordinary Swing controls. North Star theme code may layer\n# branded semantics but must not reinstall custom ComboBox/TabbedPane delegates.\nif [ ! -f src/com/wtm/ui/ThemeManager.java ] || \\
   ! grep -Fq 'FlatDarkLaf.setup()' src/com/wtm/ui/ThemeManager.java || \\
   grep -qE 'ThemedComboBoxUI|BasicTabbedPaneUI' src/com/wtm/ui/ThemeStyler.java; then\n  echo "ERROR: canonical theme ownership is not delegated to real FlatLaf." >&2\n  exit 1\nfi\n\n'''
          if gate not in s:
              if anchor not in s: raise SystemExit('FlatLaf build anchor missing')
              s=s.replace(anchor,gate+anchor,1)
          p.write_text(s)
          PY

          git diff --check
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -cp 'lib/*' -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/AppTheme.java src/com/wtm/ui/ThemeManager.java src/com/wtm/ui/Theme.java src/com/wtm/ui/ThemeStyler.java src/com/wtm/ui/HolidayThemeService.java src/com/wtm/ui/SettingsDialog.java build.sh
          git commit -m 'Make real FlatLaf the canonical theme engine'
          git push origin master
