name: FlatLaf theme core migration
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-flatlaf-theme-core.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Replace custom control theming with real FlatLaf
        shell: bash
        run: |
          set -euo pipefail
          cat > src/com/wtm/ui/AppTheme.java <<'EOF'
