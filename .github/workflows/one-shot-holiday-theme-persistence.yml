name: One-shot holiday theme persistence fix

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-holiday-theme-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore holiday-theme persistence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          config=Path('src/com/wtm/config/ConfigService.java')
          s=config.read_text()
          old='''            cfg.themeId=p.getProperty("themeId",cfg.themeId);\n            AppTheme selectedTheme=AppTheme.fromId(cfg.themeId);\n            cfg.darkMode=selectedTheme.dark();\n'''
          new='''            cfg.themeId=p.getProperty("themeId",cfg.themeId);\n            cfg.automaticHolidayThemes=bool(\n                    p,"automaticHolidayThemes",cfg.automaticHolidayThemes);\n            AppTheme selectedTheme=AppTheme.fromId(cfg.themeId);\n            cfg.darkMode=selectedTheme.dark();\n'''
          if s.count(old)!=1:
              raise SystemExit('ConfigService theme load anchor mismatch')
          config.write_text(s.replace(old,new))

          build=Path('build.sh')
          b=build.read_text()
          anchor='''# Startup must honor the configured/manual theme (with optional holiday override)\n'''
          # The startup-theme gate may not exist yet on all cleanup heads. Insert
          # persistence protection immediately before the output build section.
          fallback='''rm -rf out\n'''
          gate='''# Automatic holiday-theme preference is persisted and must be loaded back.\nif ! grep -Fq 'p,"automaticHolidayThemes",cfg.automaticHolidayThemes' src/com/wtm/config/ConfigService.java || \\
   ! grep -Fq 'p.setProperty("automaticHolidayThemes",Boolean.toString(cfg.automaticHolidayThemes));' src/com/wtm/config/ConfigService.java; then\n  echo "ERROR: automatic holiday-theme persistence is incomplete." >&2\n  exit 1\nfi\n\n'''
          if gate not in b:
              if fallback not in b:
                  raise SystemExit('build output anchor mismatch')
              b=b.replace(fallback,gate+fallback,1)
              build.write_text(b)
          PY
          git diff --check
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit holiday-theme persistence fix
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/config/ConfigService.java build.sh
          git commit -m 'Persist automatic holiday theme preference'
          git push origin master
