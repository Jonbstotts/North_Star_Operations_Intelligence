name: Validate RC17 Startup Launch Repair

on:
  push:
    branches: [ fix/rc16-startup-launch ]
    paths:
      - '.github/workflows/tmp-rc17-startup-launch.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/rc16-startup-launch
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install permanent launch gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/patch_rc17_startup.py
          git diff --check

      - name: Build and test repair branch
        shell: bash
        env:
          NORTHSTAR_ALLOW_NONCANONICAL_BRANCH: '1'
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null

      - name: Executable JAR launch smoke
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          set +e
          HOME="$home" timeout 6s xvfb-run -a java -jar NorthStarOperations.jar > /tmp/northstar-launch.out 2>/tmp/northstar-launch.err
          code=$?
          set -e
          cat /tmp/northstar-launch.out || true
          cat /tmp/northstar-launch.err || true
          if [ "$code" -ne 124 ]; then
            echo "ERROR: executable JAR exited during launch smoke with code $code" >&2
            exit 1
          fi

      - name: Commit permanent build gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.sh
          git diff --cached --check
          git commit -m 'Gate releases on nonblocking startup migration'
          git push origin HEAD:fix/rc16-startup-launch
