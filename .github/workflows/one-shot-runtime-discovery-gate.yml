name: One-shot runtime discovery regression gate

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-runtime-discovery-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gate global and dynamic runtime discovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.sh')
          s=p.read_text()
          anchor='''if grep -q 'restrictMusicStorage' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java; then\n  echo "ERROR: workspace lifecycle reached into Music storage ownership." >&2\n  exit 1\nfi\n\n'''
          insert=anchor+'''# Canonical source must not rediscover UI/runtime ownership through reflection,\n# global AWT listeners, open-window scans, or class-name matching. getSimpleName\n# is intentionally excluded because it is used only for harmless error labels.\nif grep -R -n --include='*.java' -E 'Class\\.forName|getClass\\(\\)\\.getName|\\.getName\\(\\)\\.contains|addAWTEventListener|Window\\.getWindows' src; then\n  echo "ERROR: dynamic/global runtime discovery returned to canonical source." >&2\n  exit 1\nfi\n\n# The retired standalone .northstar directory may appear only in the explicit\n# one-time Music migration path; active hardening/storage must use ConfigService.\nif grep -Fq 'Paths.get(System.getProperty("user.home"), ".northstar")' src/com/wtm/security/LocalSecurityHardening.java; then\n  echo "ERROR: LocalSecurityHardening still targets retired .northstar storage." >&2\n  exit 1\nfi\n\n'''
          if s.count(anchor)!=1: raise SystemExit('build.sh Music storage gate anchor mismatch')
          p.write_text(s.replace(anchor,insert))
          PY
          git diff --check
          bash build.sh
      - name: Commit runtime discovery gates
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build.sh
          git commit -m 'Gate dynamic runtime discovery regressions'
          git push origin master
