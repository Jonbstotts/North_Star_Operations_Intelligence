name: One-shot stage CI reconciliation

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-stage-ci-reconciliation.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Stage reconciled canonical CI file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build.yml').read_text()
          old="""          grep -q 'WorkspaceLifecycleV3.settingsApplied(this)' src/com/wtm/ui/SettingsDialog.java\n          ! grep -q 'SwingUtilities.invokeLater(this::showDashboardRoute)' src/com/wtm/ui/OperationsWorkspaceFrame.java\n"""
          new="""          grep -q 'WorkspaceLifecycleV3.settingsApplied(this)' src/com/wtm/ui/SettingsDialog.java\n          grep -q 'registerWorkspaceModuleToggle' src/com/wtm/ui/SettingsDialog.java\n          grep -q 'workspaceModuleToggle' src/com/wtm/ui/SettingsDialog.java\n          ! grep -qE 'findCheckBox|findMarkedCheckBox|commonParent' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java\n          ! grep -q 'SwingUtilities.invokeLater(this::showDashboardRoute)' src/com/wtm/ui/OperationsWorkspaceFrame.java\n"""
          if src.count(old)!=1: raise SystemExit('settings ownership CI anchor mismatch')
          src=src.replace(old,new)
          old="""          ! grep -q 'polishMusicTree' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java\n          ! test -f src/com/wtm/ui/foundation/UiFoundationRuntime.java\n"""
          new="""          ! grep -q 'polishMusicTree' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java\n          grep -q 'mountDashboardExtension(String id' src/com/wtm/ui/OperationsWorkspaceFrame.java\n          grep -q 'removeDashboardExtension(String id)' src/com/wtm/ui/OperationsWorkspaceFrame.java\n          ! grep -q 'findByName' src/com/wtm/app/AiEnabledMain.java\n          ! grep -q 'findMarked' src/com/wtm/modular/ui/MusicModuleGuard.java\n          ! grep -qE 'findMarked|removeMarked|removeNamed' src/com/wtm/modular/ui/WorkspaceLifecycleV3.java\n          ! test -f src/com/wtm/ui/foundation/UiFoundationRuntime.java\n"""
          if src.count(old)!=1: raise SystemExit('dashboard ownership CI anchor mismatch')
          src=src.replace(old,new)
          old="""          grep -q 'dashboardBody' src/com/wtm/app/AiEnabledMain.java\n          ! grep -q 'DashboardGridPanel' src/com/wtm/app/AiEnabledMain.java\n"""
          new="""          grep -q 'mountDashboardExtension' src/com/wtm/app/AiEnabledMain.java\n          ! grep -q 'dashboardBody' src/com/wtm/app/AiEnabledMain.java\n          ! grep -q 'DashboardGridPanel' src/com/wtm/app/AiEnabledMain.java\n"""
          if src.count(old)!=1: raise SystemExit('Intelligence CI mount anchor mismatch')
          src=src.replace(old,new)
          out=Path('ci/build-next.yml')
          out.parent.mkdir(exist_ok=True)
          out.write_text(src)
          PY
          git diff --check
          grep -q 'mountDashboardExtension(String id' ci/build-next.yml
          grep -q 'registerWorkspaceModuleToggle' ci/build-next.yml
          ! grep -q "grep -q 'dashboardBody' src/com/wtm/app/AiEnabledMain.java" ci/build-next.yml
      - name: Commit staged CI file
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/build-next.yml
          git commit -m 'Stage reconciled canonical CI policy'
          git push origin master
