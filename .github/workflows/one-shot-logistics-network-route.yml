name: Integrate Logistics Network into Traffic and Routes
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-logistics-network-route.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Integrate source-owned Logistics Network
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/com/wtm/ui/LogisticsNetworkPanel.java')
          s=p.read_text()
          old='''        if(!ThemedDialogs.confirm(this,"Remove “"+n.name()+"” from the Logistics Network?","Remove Location"))return;'''
          new='''        if(!ThemedDialogs.confirm(\n                this,\n                "Remove “"+n.name()+"” from the Logistics Network?",\n                "Remove Location",\n                "Remove",\n                ThemedDialogs.Kind.WARNING\n        ))return;'''
          if old not in s: raise SystemExit('Logistics confirm call not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/com/wtm/ui/SettingsDialog.java')
          s=p.read_text()
          old='''        controls.add(addFromPin);\n        controls.add(remove);\n        outer.add(controls,BorderLayout.SOUTH);\n        return outer;\n    }'''
          new='''        controls.add(addFromPin);\n        controls.add(remove);\n        outer.add(controls,BorderLayout.SOUTH);\n\n        // Traffic & Routes owns both commute routing and the reusable first-party\n        // Logistics Network. This replaces the retired runtime route injector\n        // with an explicit source-owned workspace surface.\n        JTabbedPane routePages=new JTabbedPane();\n        routePages.addTab("Commute Routes",outer);\n        routePages.addTab("Logistics Network",new LogisticsNetworkPanel());\n        JPanel page=new JPanel(new BorderLayout());\n        page.add(routePages,BorderLayout.CENTER);\n        return page;\n    }'''
          if old not in s: raise SystemExit('Routes return block not found')
          p.write_text(s.replace(old,new,1))
          PY
          bash build.sh
          git diff --check
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/LogisticsNetworkPanel.java src/com/wtm/ui/SettingsDialog.java
          git commit -m 'Restore Logistics Network under Traffic and Routes'
          git push origin master
