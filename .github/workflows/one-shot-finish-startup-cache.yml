name: Validate Startup Poster Cache Branch

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-finish-startup-cache.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout startup branch
        uses: actions/checkout@v4
        with:
          ref: tmp-startup-poster-cache
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Integrate startup media ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/patch_startup_cache.py
          git diff --check

      - name: Build and test startup branch
        shell: bash
        env:
          NORTHSTAR_ALLOW_NONCANONICAL_BRANCH: '1'
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit validated startup integration to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/com/wtm/ui/SettingsDialog.java build.sh
          git diff --cached --check
          git commit -m 'Complete startup resting-frame cache integration'
          git push origin HEAD:tmp-startup-poster-cache
