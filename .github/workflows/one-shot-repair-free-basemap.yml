      - name: Build canonical source
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/com/wtm/map/BasemapProvider.java \
            src/com/wtm/map/TileMapPanel.java \
            src/com/wtm/config/AppConfig.java \
            src/com/wtm/config/ConfigService.java \
            src/com/wtm/ui/SettingsDialog.java \
            ci/BasemapProviderSmokeTest.java \
            ci/ConfigRoundTripSmokeTest.java \
            build.sh \
            CODEBASE_GUIDE.md
          git diff --cached --check
          git commit -m 'Replace CARTO with provider-owned free basemap'
          git push origin HEAD:master
