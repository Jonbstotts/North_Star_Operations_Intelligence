name: Repair free basemap architecture

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-repair-free-basemap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply basemap provider repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'{label} anchor not found in {path}')
              p.write_text(text.replace(old,new,1))

          Path('src/com/wtm/map/BasemapProvider.java').write_text(r'''package com.wtm.map;

import java.awt.image.BufferedImage;
import java.util.Locale;

/**
 * Owns base-map provider identity, endpoint construction, attribution, and the
 * optional local presentation transform. TileMapPanel composes layers; it does
 * not know vendor URLs or vendor-specific styling rules.
 *
 * OpenStreetMap Standard is the zero-cost development default. It is a
 * best-effort community tile service rather than a commercial SLA. Adding a
 * production provider later is an adapter change here, not a renderer rewrite.
 */
public enum BasemapProvider {
    OPENSTREETMAP(
            "OPENSTREETMAP",
            "OpenStreetMap Standard (no key)",
            "© OpenStreetMap contributors",
            "osm-standard-v1"
    );

    private final String id;
    private final String displayName;
    private final String attribution;
    private final String cacheNamespace;

    BasemapProvider(
            String id,
            String displayName,
            String attribution,
            String cacheNamespace
    ){
        this.id=id;
        this.displayName=displayName;
        this.attribution=attribution;
        this.cacheNamespace=cacheNamespace;
    }

    public String id(){return id;}
    public String displayName(){return displayName;}
    public String attribution(){return attribution;}
    public String cacheNamespace(){return cacheNamespace;}

    public String tileUrl(int zoom,int x,int y){
        return switch(this){
            case OPENSTREETMAP -> "https://tile.openstreetmap.org/"
                    +zoom+"/"+x+"/"+y+".png";
        };
    }

    /**
     * OSM publishes one standard raster style. North Star derives its dark
     * dashboard appearance locally so dark mode does not depend on a second
     * unauthenticated tile vendor. The raw OSM tile remains the cached source.
     */
    public BufferedImage renderTile(BufferedImage source,boolean darkMode){
        if(source==null||!darkMode)return source;

        BufferedImage out=new BufferedImage(
                source.getWidth(),source.getHeight(),BufferedImage.TYPE_INT_ARGB);

        for(int y=0;y<source.getHeight();y++){
            for(int x=0;x<source.getWidth();x++){
                int argb=source.getRGB(x,y);
                int alpha=(argb>>>24)&0xff;
                int red=(argb>>>16)&0xff;
                int green=(argb>>>8)&0xff;
                int blue=argb&0xff;

                double luminance=(0.2126*red+0.7152*green+0.0722*blue)/255.0;
                int gray=(int)Math.round(luminance*255.0);
                int base=(int)Math.round(20.0+(1.0-luminance)*145.0);

                int r=clamp(base+(int)Math.round((red-gray)*0.18));
                int g=clamp(base+3+(int)Math.round((green-gray)*0.18));
                int b=clamp(base+8+(int)Math.round((blue-gray)*0.22));

                out.setRGB(x,y,(alpha<<24)|(r<<16)|(g<<8)|b);
            }
        }
        return out;
    }

    public static BasemapProvider fromId(String value){
        String normalized=value==null?"":value.trim().toUpperCase(Locale.ROOT);
        for(BasemapProvider provider:values())
            if(provider.id.equals(normalized))return provider;
        return OPENSTREETMAP;
    }

    @Override public String toString(){return displayName;}

    private static int clamp(int value){
        return Math.max(0,Math.min(255,value));
    }
}
''')

          Path('ci/BasemapProviderSmokeTest.java').write_text(r'''import com.wtm.config.AppConfig;
import com.wtm.map.BasemapProvider;

import java.awt.image.BufferedImage;

public final class BasemapProviderSmokeTest {
    private static void require(boolean condition,String message){
        if(!condition)throw new AssertionError(message);
    }

    private static int luminance(int argb){
        int r=(argb>>>16)&0xff;
        int g=(argb>>>8)&0xff;
        int b=argb&0xff;
        return (int)Math.round(0.2126*r+0.7152*g+0.0722*b);
    }

    public static void main(String[] args){
        AppConfig defaults=new AppConfig();
        require("OPENSTREETMAP".equals(defaults.basemapProvider),
                "OpenStreetMap must remain the zero-cost development default");

        BasemapProvider provider=BasemapProvider.fromId(defaults.basemapProvider);
        require(provider==BasemapProvider.OPENSTREETMAP,
                "default provider did not resolve to OpenStreetMap");
        require("https://tile.openstreetmap.org/9/123/456.png".equals(
                        provider.tileUrl(9,123,456)),
                "OpenStreetMap endpoint does not match the canonical tile URL");
        require(provider.attribution().contains("OpenStreetMap contributors"),
                "visible OpenStreetMap attribution is missing");
        require(BasemapProvider.fromId("unknown")==BasemapProvider.OPENSTREETMAP,
                "unknown provider IDs must fail safely to the free default");

        BufferedImage sample=new BufferedImage(2,1,BufferedImage.TYPE_INT_ARGB);
        sample.setRGB(0,0,0xffffffff);
        sample.setRGB(1,0,0xff000000);
        BufferedImage dark=provider.renderTile(sample,true);
        require(dark!=sample,"dark rendering must not mutate the cached source tile");
        require(dark.getWidth()==2&&dark.getHeight()==1,
                "dark rendering changed tile dimensions");
        require(luminance(dark.getRGB(0,0))<70,
                "light map background did not become dark enough");
        require(luminance(dark.getRGB(1,0))>luminance(dark.getRGB(0,0))+70,
                "dark source labels/features did not become legible on dark background");
        require(provider.renderTile(sample,false)==sample,
                "light mode should preserve the raw provider tile");

        System.out.println("BASEMAP_PROVIDER_SMOKE_OK");
    }
}
''')

