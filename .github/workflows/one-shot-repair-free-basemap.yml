name: Repair free basemap architecture

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-repair-free-basemap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply provider-owned free basemap repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/repair_free_basemap.py
          test -f src/com/wtm/map/BasemapProvider.java
          grep -Fq 'https://tile.openstreetmap.org/' src/com/wtm/map/BasemapProvider.java
          grep -Fq 'resolve("cache").resolve("map-v2")' src/com/wtm/map/TileMapPanel.java
          grep -Fq 'Basemap provider' src/com/wtm/ui/SettingsDialog.java
          grep -Fq 'basemapProvider' src/com/wtm/config/ConfigService.java
          ! grep -R -q --include='*.java' 'basemaps\.cartocdn\.com' src
          git diff --check

      - name: Build canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/com/wtm/map/BasemapProvider.java \
            src/com/wtm/map/TileMapPanel.java \
            src/com/wtm/config/AppConfig.java \
            src/com/wtm/config/ConfigService.java \
            src/com/wtm/ui/SettingsDialog.java \
            ci/BasemapProviderSmokeTest.java \
            ci/ConfigRoundTripSmokeTest.java \
            build.sh \
            CODEBASE_GUIDE.md
          git diff --cached --check
          git commit -m 'Replace CARTO with provider-owned free basemap'
          git push origin HEAD:master
