name: Stage FlatLaf CI
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-stage-flatlaf-ci.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Stage canonical workflow
        run: python3 ci/stage_flatlaf_ci.py
      - name: Commit staged workflow
        run: |
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/build-next.yml
          git commit -m 'Stage FlatLaf-aware canonical CI'
          git push origin master
