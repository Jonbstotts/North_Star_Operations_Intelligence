name: One-shot unchecked warning cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-unchecked-warning-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove unchecked combo-box renderer warning
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/com/wtm/ui/ThemedComboBoxUI.java')
          s=p.read_text()
          old='''            @SuppressWarnings({"rawtypes","unchecked"})\n            JComboBox raw=combo;\n            raw.setRenderer(new DefaultListCellRenderer(){\n                @Override\n                public Component getListCellRendererComponent(\n                        JList<?> list,\n                        Object value,\n                        int index,\n                        boolean selected,\n                        boolean focus\n                ){\n                    JLabel label=(JLabel)super.getListCellRendererComponent(\n                            list,value,index,selected,focus);\n                    label.setOpaque(true);\n                    label.setBorder(new EmptyBorder(8,12,8,12));\n                    label.setFont(new Font(Font.SANS_SERIF,Font.PLAIN,14));\n                    label.setBackground(selected?theme.accent():theme.panel2());\n                    label.setForeground(selected\n                            ?readableText(theme.accent())\n                            :theme.text());\n                    return label;\n                }\n            });\n'''
          new='''            installRenderer(combo);\n'''
          if s.count(old)!=1:
              raise SystemExit('combo renderer anchor mismatch')
          s=s.replace(old,new)
          anchor='''    @Override\n    protected JButton createArrowButton(){\n'''
          helper='''    private <T> void installRenderer(JComboBox<T> combo){\n        combo.setRenderer(new DefaultListCellRenderer(){\n            @Override\n            public Component getListCellRendererComponent(\n                    JList<?> list,\n                    Object value,\n                    int index,\n                    boolean selected,\n                    boolean focus\n            ){\n                JLabel label=(JLabel)super.getListCellRendererComponent(\n                        list,value,index,selected,focus);\n                label.setOpaque(true);\n                label.setBorder(new EmptyBorder(8,12,8,12));\n                label.setFont(new Font(Font.SANS_SERIF,Font.PLAIN,14));\n                label.setBackground(selected?theme.accent():theme.panel2());\n                label.setForeground(selected\n                        ?readableText(theme.accent())\n                        :theme.text());\n                return label;\n            }\n        });\n    }\n\n'''+anchor
          if s.count(anchor)!=1:
              raise SystemExit('arrow method anchor mismatch')
          p.write_text(s.replace(anchor,helper))

          build=Path('build.sh')
          b=build.read_text()
          old_compile="javac --release 21 -encoding UTF-8 -d out $(find src -name '*.java')"
          new_compile="javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -d out $(find src -name '*.java')"
          if b.count(old_compile)!=1:
              raise SystemExit('build compile anchor mismatch')
          build.write_text(b.replace(old_compile,new_compile))
          PY
          git diff --check
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -Werror -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit warning cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/ThemedComboBoxUI.java build.sh
          git commit -m 'Eliminate unchecked combo-box renderer warning'
          git push origin master
