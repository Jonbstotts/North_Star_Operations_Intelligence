          if anchor not in s: raise SystemExit('ThemedFileChooser anchor missing')
          p.write_text(s.replace(anchor,addition,1))

          # Settings fields/UI/load/save.
          p=Path('src/com/wtm/ui/SettingsDialog.java')
          s=p.read_text()
