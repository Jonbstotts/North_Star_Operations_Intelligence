name: Implement startup experience architecture
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-startup-experience.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Implement managed optional startup intro
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p lib
          curl -fsSL -o lib/jcodec-0.2.5.jar https://repo1.maven.org/maven2/org/jcodec/jcodec/0.2.5/jcodec-0.2.5.jar
          curl -fsSL -o lib/jcodec-javase-0.2.5.jar https://repo1.maven.org/maven2/org/jcodec/jcodec-javase/0.2.5/jcodec-javase-0.2.5.jar

