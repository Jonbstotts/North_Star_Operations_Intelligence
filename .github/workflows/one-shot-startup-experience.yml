          addition=anchor+'''    private final JComboBox<String> startupExperience=new JComboBox<>(new String[]{\n            "Static Splash","Intro Video","No Startup Screen"});\n    private final JLabel startupVideoStatus=new JLabel("No intro video selected");\n    private String pendingStartupVideoAsset="";\n'''
          if anchor not in s: raise SystemExit('Settings fields anchor missing')
          s=s.replace(anchor,addition,1)

          anchor='''        addFull(p,y++,fullscreen);\n\n        JLabel identity=new JLabel('''
          addition='''        addFull(p,y++,fullscreen);\n        addRow(p,y++,"Startup experience",startupExperience);\n\n        JPanel startupMediaControls=new JPanel(new FlowLayout(FlowLayout.LEFT,8,0));\n        JButton chooseIntro=new JButton("Choose Intro Video...");\n        chooseIntro.addActionListener(e->chooseStartupVideo());\n        JButton clearIntro=new JButton("Clear Selection");\n        clearIntro.addActionListener(e->{\n            pendingStartupVideoAsset="";\n            updateStartupVideoStatus();\n        });\n        startupMediaControls.add(chooseIntro);\n        startupMediaControls.add(clearIntro);\n        startupMediaControls.add(startupVideoStatus);\n        addFull(p,y++,startupMediaControls);\n\n        JLabel startupHelp=new JLabel(\n                "<html>The intro video is copied into North Star managed storage instead of "\n              + "being embedded in the application JAR. H.264 MP4/MOV is recommended. "\n              + "Press <b>Esc</b> or <b>Skip Intro</b> during playback. This first portable "\n              + "implementation plays the visual track without audio.</html>");\n        addFull(p,y++,startupHelp);\n\n        JLabel identity=new JLabel('''
          if anchor not in s: raise SystemExit('Settings general anchor missing')
          s=s.replace(anchor,addition,1)

          anchor='''    private void updateAutomaticSevereControls(){'''
          addition='''    private void chooseStartupVideo(){\n        JFileChooser chooser=ThemedFileChooser.chooseVideo(this);\n        if(chooser==null||chooser.getSelectedFile()==null)return;\n        try{\n            Path imported=MediaService.importStartupVideo(\n                    chooser.getSelectedFile().toPath());\n            pendingStartupVideoAsset=MediaService.assetName(imported);\n            startupExperience.setSelectedItem("Intro Video");\n            updateStartupVideoStatus();\n        }catch(Exception ex){\n            ThemedDialogs.message(\n                    this,\n                    ex.getMessage()==null?"The startup video could not be imported.":ex.getMessage(),\n                    "Startup Video Import Failed",\n                    ThemedDialogs.Kind.ERROR\n            );\n        }\n    }\n\n    private void updateStartupVideoStatus(){\n        if(pendingStartupVideoAsset==null||pendingStartupVideoAsset.isBlank()){\n            startupVideoStatus.setText("No intro video selected");\n            startupVideoStatus.setToolTipText(null);\n        }else{\n            startupVideoStatus.setText("Selected: "+pendingStartupVideoAsset);\n            startupVideoStatus.setToolTipText(pendingStartupVideoAsset);\n        }\n    }\n\n    private static String startupModeFromUi(Object value){\n        String text=String.valueOf(value);\n        if("Intro Video".equals(text))return "INTRO_VIDEO";\n        if("No Startup Screen".equals(text))return "NONE";\n        return "STATIC_SPLASH";\n    }\n\n    private static String startupModeToUi(String value){\n        if("INTRO_VIDEO".equalsIgnoreCase(value))return "Intro Video";\n        if("NONE".equalsIgnoreCase(value))return "No Startup Screen";\n        return "Static Splash";\n    }\n\n    private void updateAutomaticSevereControls(){'''
          if anchor not in s: raise SystemExit('Settings helper anchor missing')
          s=s.replace(anchor,addition,1)

