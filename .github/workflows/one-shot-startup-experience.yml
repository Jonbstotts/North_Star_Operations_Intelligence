          if anchor not in s: raise SystemExit('ConfigService peek anchor missing')
          s=s.replace(anchor,addition,1)
          anchor='''            cfg.showHeader = bool(p, "showHeader", cfg.showHeader);\n            cfg.showTicker = bool(p, "showTicker", cfg.showTicker);\n'''
