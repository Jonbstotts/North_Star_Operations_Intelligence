          cat > src/com/wtm/ui/StartupExperienceManager.java <<'JAVA'
          package com.wtm.ui;

          import com.wtm.config.AppConfig;
          import com.wtm.media.MediaCategory;
          import com.wtm.media.MediaService;
          import com.wtm.security.AuditService;
          import org.jcodec.api.FrameGrab;
          import org.jcodec.common.io.NIOUtils;
          import org.jcodec.common.io.SeekableByteChannel;
          import org.jcodec.common.model.Picture;
          import org.jcodec.scale.AWTUtil;

          import javax.swing.*;
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.nio.file.Path;
          import java.util.concurrent.atomic.AtomicBoolean;

          /**
           * Owns the optional startup intro presentation.
           *
           * Playback is intentionally portable and pure Java. H.264 MP4/MOV visual
           * frames are decoded with JCodec off the EDT. Audio is not played by this
           * first implementation, avoiding native VLC/JavaFX runtime dependencies.
           */
          public final class StartupExperienceManager {
              private StartupExperienceManager(){}

              /** @return true when asynchronous intro playback was started. */
              public static boolean playIntroIfConfigured(AppConfig config,Runnable completion){
                  if(config==null||!"INTRO_VIDEO".equalsIgnoreCase(config.startupExperience))return false;
                  Path video=MediaService.resolve(MediaCategory.STARTUP_MEDIA,config.startupVideoAsset);
                  if(video==null)return false;
                  Runnable done=completion==null?()->{}:completion;
                  IntroWindow window=new IntroWindow(video,done);
                  window.setVisible(true);
                  window.start();
                  return true;
              }

              private static final class IntroWindow extends JWindow {
                  private final Path video;
                  private final Runnable completion;
                  private final VideoPanel videoPanel=new VideoPanel();
                  private final AtomicBoolean finished=new AtomicBoolean(false);
                  private volatile boolean stopRequested;

                  IntroWindow(Path video,Runnable completion){
                      this.video=video;
                      this.completion=completion;
                      setBackground(Color.BLACK);
                      setAlwaysOnTop(true);

                      Rectangle bounds=GraphicsEnvironment.getLocalGraphicsEnvironment()
                              .getMaximumWindowBounds();
                      setBounds(bounds);

                      JPanel root=new JPanel(new BorderLayout());
                      root.setBackground(Color.BLACK);
                      root.add(videoPanel,BorderLayout.CENTER);

                      JButton skip=new JButton("Skip Intro");
                      skip.addActionListener(e->finish());
                      JPanel controls=new JPanel(new FlowLayout(FlowLayout.RIGHT,16,12));
                      controls.setOpaque(false);
                      controls.add(skip);
                      root.add(controls,BorderLayout.SOUTH);
                      setContentPane(root);

                      getRootPane().registerKeyboardAction(
                              e->finish(),
                              KeyStroke.getKeyStroke("ESCAPE"),
                              JComponent.WHEN_IN_FOCUSED_WINDOW
                      );
                      ApplicationBrand.applyWindowIcon(this);
                  }

                  void start(){
                      Thread decoder=new Thread(this::decodeLoop,"northstar-startup-video");
                      decoder.setDaemon(true);
                      decoder.start();
                  }

                  private void decodeLoop(){
                      SeekableByteChannel channel=null;
                      try{
                          channel=NIOUtils.readableChannel(video.toFile());
                          FrameGrab grab=FrameGrab.createFrameGrab(channel);
                          long next=System.nanoTime();
                          while(!stopRequested){
                              Picture picture=grab.getNativeFrame();
                              if(picture==null)break;
                              BufferedImage frame=AWTUtil.toBufferedImage(picture);
                              SwingUtilities.invokeAndWait(()->videoPanel.setFrame(frame));

                              // Default pacing for typical 30fps intro exports. Decode cost
                              // naturally reduces/removes the sleep on slower hardware.
                              next+=33_333_333L;
                              long remaining=next-System.nanoTime();
                              if(remaining>0){
                                  long millis=remaining/1_000_000L;
                                  int nanos=(int)(remaining%1_000_000L);
                                  Thread.sleep(millis,nanos);
                              }else{
                                  next=System.nanoTime();
                              }
                          }
                      }catch(Throwable ex){
                          AuditService.record(
                                  "Startup intro playback failed: "+ex.getClass().getSimpleName());
                      }finally{
                          NIOUtils.closeQuietly(channel);
                          SwingUtilities.invokeLater(this::finish);
                      }
                  }

                  private void finish(){
                      if(!finished.compareAndSet(false,true))return;
                      stopRequested=true;
                      setVisible(false);
                      dispose();
                      completion.run();
                  }
              }

              private static final class VideoPanel extends JPanel {
                  private BufferedImage frame;

                  VideoPanel(){ setBackground(Color.BLACK); }

                  void setFrame(BufferedImage next){
                      frame=next;
                      repaint();
                  }

                  @Override protected void paintComponent(Graphics graphics){
                      super.paintComponent(graphics);
                      BufferedImage image=frame;
                      if(image==null)return;
                      int w=getWidth();
                      int h=getHeight();
                      double scale=Math.min(
                              w/(double)image.getWidth(),
                              h/(double)image.getHeight());
                      int dw=Math.max(1,(int)Math.round(image.getWidth()*scale));
                      int dh=Math.max(1,(int)Math.round(image.getHeight()*scale));
                      int x=(w-dw)/2;
                      int y=(h-dh)/2;
                      Graphics2D g=(Graphics2D)graphics.create();
                      try{
                          g.setRenderingHint(
                                  RenderingHints.KEY_INTERPOLATION,
                                  RenderingHints.VALUE_INTERPOLATION_BILINEAR);
                          g.drawImage(image,x,y,dw,dh,null);
                      }finally{ g.dispose(); }
                  }
              }
          }
          JAVA

          cat > src/com/wtm/app/Main.java <<'JAVA'
          package com.wtm.app;

          import com.wtm.config.*;
          import com.wtm.security.*;
          import com.wtm.ui.*;
          import com.wtm.employee.EmployeeService;
          import com.wtm.callin.CallInServerManager;

          import javax.swing.*;

          /** North Star Operations Intelligence desktop application entry point. */
          public final class Main {
              private Main(){}

              public static void main(String[] args){
                  System.setProperty("apple.awt.application.name","North Star Operations");
                  System.setProperty("apple.awt.application.appearance","system");

                  SwingUtilities.invokeLater(()->{
                      AppTheme bootTheme=AppTheme.fromId(ConfigService.peekThemeId());
                      Theme.setActive(bootTheme.id());
                      ApplicationBrand.applyApplicationIcon();

                      String bootExperience=ConfigService.peekStartupExperience();
                      NorthStarSplashScreen splash="STATIC_SPLASH".equals(bootExperience)
                              ?new NorthStarSplashScreen():null;
                      if(splash!=null){
                          splash.setVisible(true);
                          splash.updateProgress(18,"Loading secure application configuration...");
                      }

                      SwingWorker<AppConfig,Void> loader=new SwingWorker<>(){
                          @Override protected AppConfig doInBackground(){
                              if(splash!=null)splash.updateProgress(
                                      42,
                                      "Initializing data providers and local storage...");
                              return ConfigService.load();
                          }

                          @Override protected void done(){
                              try{
                                  AppConfig config=get();
                                  prepareConfiguration(config);
                                  AppTheme theme=HolidayThemeService.effectiveTheme(
                                          config,java.time.LocalDate.now());
                                  config.darkMode=theme.dark();
                                  Theme.setActive(theme.id());
                                  CallInServerManager.apply(config);

                                  if(splash!=null)splash.updateProgress(
                                          72,"Preparing secure user session...");

                                  Runnable afterPresentation=()->continueAfterStartupPresentation(
                                          config,theme);

                                  if("INTRO_VIDEO".equalsIgnoreCase(config.startupExperience)){
                                      if(splash!=null)splash.closeSplash();
                                      if(!StartupExperienceManager.playIntroIfConfigured(
                                              config,afterPresentation))
                                          afterPresentation.run();
                                      return;
                                  }

                                  if(splash!=null){
                                      splash.updateProgress(100,"North Star ready.");
                                      Timer closeTimer=new Timer(650,e->{
                                          ((Timer)e.getSource()).stop();
                                          splash.closeSplash();
                                          afterPresentation.run();
                                      });
                                      closeTimer.setRepeats(false);
                                      closeTimer.start();
                                      return;
                                  }

                                  afterPresentation.run();
                              }catch(Exception ex){
                                  if(splash!=null)splash.closeSplash();
                                  ThemedDialogs.message(
                                          null,
                                          "North Star could not complete startup. "
                                          +"Review the local configuration and try again.",
                                          "Startup Error",
                                          ThemedDialogs.Kind.ERROR
                                  );
                              }
                          }
                      };
                      loader.execute();
                  });
              }

              private static void prepareConfiguration(AppConfig config){
                  boolean employeeMigration=
                          EmployeeService.migrateLegacyCelebrationsIfNeeded(config);
                  EmployeeService.syncCelebrations(
                          config,
                          EmployeeService.loadForSystem()
                  );
                  if(employeeMigration)ConfigService.save(config);
              }

              private static void continueAfterStartupPresentation(
                      AppConfig config,
                      AppTheme theme
              ){
                  if(!UserService.hasUsers()){
                      UserAccount initial=AuthService.hasPassword()
                              ?LegacyAdminMigrationDialog.migrate(null,theme)
                              :FirstAdminDialog.create(null,theme);
                      if(initial==null)return;
                      SessionManager.login(initial);
                  }
                  continueStartup(config,theme);
              }

              private static void continueStartup(AppConfig config,AppTheme theme){
                  if(config.loginRequiredOnStartup
                          &&!SessionManager.isAuthenticated()){
                      UserAccount account=UserLoginDialog.authenticate(
                              null,
                              "North Star Login",
                              "Sign in to continue to the operations dashboard.",
                              theme,
                              ""
                      );
                      if(account==null)return;
                      SessionManager.login(account);
                  }

                  OperationsWorkspaceFrame frame=new OperationsWorkspaceFrame(config);
                  frame.setVisible(true);
              }
          }
          JAVA

