name: One-shot runtime residue audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-runtime-residue-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove stale MusicKit build metadata and audit runtime residue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/com/wtm/modular/ui/MusicModuleGuard.java')
          s=p.read_text()
          old="app:{name:'NorthStar Operations Intelligence',build:'2.1.30'}"
          new="app:{name:'NorthStar Operations Intelligence',build:'2.1.34'}"
          if s.count(old)!=1: raise SystemExit('MusicKit build metadata anchor mismatch')
          p.write_text(s.replace(old,new))
          PY
          echo '--- legacy app-directory references ---'
          grep -R -n --include='*.java' -E '\.northstar|\.weather-traffic-monitor' src || true
          echo '--- dynamic/global runtime discovery ---'
          grep -R -n --include='*.java' -E 'Class\.forName|getClass\(\)\.getName|getClass\(\)\.getSimpleName|\.getName\(\)\.contains|addAWTEventListener|Window\.getWindows' src || true
          echo '--- scheduler/timer inventory ---'
          grep -R -n --include='*.java' -E 'new Timer|scheduleAtFixedRate|scheduleWithFixedDelay|ScheduledExecutor' src || true
          git diff --check
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit MusicKit metadata cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/modular/ui/MusicModuleGuard.java
          git commit -m 'Align MusicKit metadata with clean-sweep release'
          git push origin master
