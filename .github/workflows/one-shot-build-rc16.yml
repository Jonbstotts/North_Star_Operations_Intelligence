name: Build NorthStar GUI RC16

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc16.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin clean RC16 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 36b3085678d1a4f337a66f15cd4c4d1ba2b9b7e1
          test "$(git rev-parse HEAD)" = "36b3085678d1a4f337a66f15cd4c4d1ba2b9b7e1"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC16.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC16.jar > NorthStar-v2.1.34-GUI-RC16-SHA256SUMS.txt
          {
            echo "NorthStar Operations Intelligence v2.1.34 GUI RC16"
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Source tree: $(git rev-parse HEAD^{tree})"
            echo "Java: $(java -version 2>&1 | head -1)"
            echo "Build UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Purpose: startup movie/login presentation and lossless final-frame poster cache"
          } > NorthStar-v2.1.34-GUI-RC16-BUILDINFO.txt
          cat NorthStar-v2.1.34-GUI-RC16-SHA256SUMS.txt

      - name: Upload RC16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC16
          if-no-files-found: error
          retention-days: 30
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC16.jar
            NorthStar-v2.1.34-GUI-RC16-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC16-BUILDINFO.txt
