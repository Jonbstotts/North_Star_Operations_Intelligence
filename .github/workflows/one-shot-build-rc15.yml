name: Build NorthStar GUI RC15

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc15.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC15 source
        uses: actions/checkout@v4
        with:
          ref: 63088ed2e61159321e631ad831a72d24302d2dff
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC15
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC15.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC15.jar > NorthStar-v2.1.34-GUI-RC15-SHA256SUMS.txt
          {
            echo 'NorthStar Operations Intelligence v2.1.34 GUI RC15'
            echo 'Source commit: 63088ed2e61159321e631ad831a72d24302d2dff'
            echo 'Change: Music player moved from summary/header strip into the resizable dashboard grid.'
            echo 'Workspace Setup toggle: Music Player'
            echo 'Default music tile geometry: 0,15,8,3 on the 24-column dashboard grid.'
            echo 'Canonical source validation: passed before RC15 build.'
          } > NorthStar-v2.1.34-GUI-RC15-BUILDINFO.txt

      - name: Upload RC15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC15
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC15.jar
            NorthStar-v2.1.34-GUI-RC15-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC15-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
