name: One-shot workspace lifecycle audit

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-workspace-lifecycle-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inspect explicit workspace lifecycle anchors
        run: |
          set -euo pipefail
          echo '=== Operations workspace route/save anchors ==='
          grep -n -B 18 -A 45 'openWorkspaceSettingsPage\|showDashboardRoute\|new SettingsDialog' src/com/wtm/ui/OperationsWorkspaceFrame.java || true
          echo '=== Settings save and construction anchors ==='
          grep -n -B 12 -A 25 'public SettingsDialog\|private void save()' src/com/wtm/ui/SettingsDialog.java || true
          echo '=== WorkspaceLifecycle callers ==='
          grep -R -n --include='*.java' 'WorkspaceLifecycleV3' src || true
