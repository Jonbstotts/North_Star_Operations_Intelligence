name: Finish company dashboard glyph repair
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-finish-company-glyph-repair.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Diagnose supplied company glyph reconstruction
        shell: bash
        run: |
          mkdir -p tmp /tmp/ns-glyph-repair
          LOG=tmp/glyph_repair_diagnostic.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set -x
          HIST=2837d9a74cafd0d32031c502586d6df9aa711e0f
          TMPBR=tmp-glyph-repair-diagnostic
          git fetch origin "$TMPBR:refs/remotes/origin/$TMPBR"; echo "FETCH_RC=$?"
          git cat-file -t "$HIST"; echo "HIST_RC=$?"
          : > /tmp/ns-glyph-repair/row1.b64
          for part in 0 1 2; do
            git show "origin/$TMPBR:tmp/glyph_repair/row1.part${part}.b64" >> /tmp/ns-glyph-repair/row1.b64
            echo "ROW1_PART_${part}_RC=$?"
          done
          : > /tmp/ns-glyph-repair/row3.b64
          for part in 00 01; do
            git show "$HIST:resources/glyphs/staging/row3.b64.$part" >> /tmp/ns-glyph-repair/row3.b64
            echo "ROW3_PART_${part}_RC=$?"
          done
          wc -c /tmp/ns-glyph-repair/row1.b64 /tmp/ns-glyph-repair/row3.b64
          tr -d '\r\n ' < /tmp/ns-glyph-repair/row1.b64 | base64 -d > /tmp/ns-glyph-repair/row1.png
          echo "ROW1_DECODE_RC=$?"
          tr -d '\r\n ' < /tmp/ns-glyph-repair/row3.b64 | base64 -d > /tmp/ns-glyph-repair/row3.png
          echo "ROW3_DECODE_RC=$?"
          ls -l /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png
          sha256sum /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png
          file /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png
          cp /tmp/ns-glyph-repair/row1.png resources/glyphs/northstar_dashboard_row1.png
          echo "ROW1_COPY_RC=$?"
          cp /tmp/ns-glyph-repair/row3.png resources/glyphs/northstar_dashboard_row3.png
          echo "ROW3_COPY_RC=$?"
          python3 ci/patch_build_glyph_smoke.py
          echo "PATCH_GATE_RC=$?"
          bash build.sh
          echo "BUILD_RC=$?"
      - name: Commit diagnostic log
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/glyph_repair_diagnostic.log
          git commit -m 'Capture company glyph repair diagnostic' || true
          git push origin master
