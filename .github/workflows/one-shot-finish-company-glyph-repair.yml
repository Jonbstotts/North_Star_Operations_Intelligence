name: Finish company dashboard glyph repair
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-finish-company-glyph-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate candidate company glyph rows from repair branch
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=tmp-glyph-repair-v2
          mkdir -p /tmp/ns-glyph-candidates
          git fetch origin "$CANDIDATE:refs/remotes/origin/$CANDIDATE"
          for row in 0 1 2 3; do
            git show "origin/$CANDIDATE:resources/glyphs/northstar_dashboard_row${row}.png" > "/tmp/ns-glyph-candidates/row${row}.png"
          done
          sha256sum /tmp/ns-glyph-candidates/row*.png
          file /tmp/ns-glyph-candidates/row*.png
          cat > /tmp/ns-glyph-candidates/ValidateGlyphRows.java <<'JAVA'
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.File;
          public final class ValidateGlyphRows {
              public static void main(String[] args) {
                  int failures = 0;
                  for (String arg : args) {
                      try {
                          BufferedImage image = ImageIO.read(new File(arg));
                          if (image == null) throw new IllegalStateException("ImageIO returned null");
                          image.getRGB(image.getWidth() - 1, image.getHeight() - 1);
                          int cell = image.getWidth() / 9;
                          if (image.getWidth() % 9 != 0 || image.getHeight() != cell) throw new IllegalStateException("invalid atlas geometry");
                          System.out.println("VALID " + arg + " => " + image.getWidth() + "x" + image.getHeight() + " cell=" + cell);
                      } catch (Throwable t) {
                          failures++;
                          System.out.println("INVALID " + arg + " => " + t);
                      }
                  }
                  if (failures != 0) throw new IllegalStateException(failures + " glyph row(s) invalid");
              }
          }
          JAVA
          javac --release 21 /tmp/ns-glyph-candidates/ValidateGlyphRows.java
          java -cp /tmp/ns-glyph-candidates ValidateGlyphRows /tmp/ns-glyph-candidates/row0.png /tmp/ns-glyph-candidates/row1.png /tmp/ns-glyph-candidates/row2.png /tmp/ns-glyph-candidates/row3.png
