name: Finish company dashboard glyph repair
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-finish-company-glyph-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and diagnose supplied company glyph rows
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=2a181cba2e05b6bf59a620c41eb20eeca590a584
          mkdir -p /tmp/ns-glyph-repair
          for row in 0 1 2 3; do : > "/tmp/ns-glyph-repair/row${row}.b64"; done
          for part in 00 01 02; do
            git show "$SOURCE:resources/glyphs/staging/row0.b64.$part" >> /tmp/ns-glyph-repair/row0.b64
            git show "$SOURCE:resources/glyphs/staging/row1.b64.$part" >> /tmp/ns-glyph-repair/row1.b64
            git show "$SOURCE:resources/glyphs/staging/row2.b64.$part" >> /tmp/ns-glyph-repair/row2.b64
          done
          for part in 00 01; do
            git show "$SOURCE:resources/glyphs/staging/row3.b64.$part" >> /tmp/ns-glyph-repair/row3.b64
          done
          python3 - <<'PY'
          import base64, pathlib, re
          root = pathlib.Path('/tmp/ns-glyph-repair')
          for row in range(4):
              cleaned = re.sub(rb'\s+', b'', (root / f'row{row}.b64').read_bytes())
              cleaned = cleaned.replace(b'=', b'')
              cleaned += b'=' * ((-len(cleaned)) % 4)
              data = base64.b64decode(cleaned, validate=True)
              (root / f'row{row}.png').write_bytes(data)
              print(f'row{row}: decoded={len(data)}')
          PY
          sha256sum /tmp/ns-glyph-repair/row*.png
          file /tmp/ns-glyph-repair/row*.png
          cat > /tmp/ns-glyph-repair/ValidateGlyphRows.java <<'JAVA'
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.File;
          public final class ValidateGlyphRows {
              public static void main(String[] args) {
                  int failures = 0;
                  for (String arg : args) {
                      try {
                          BufferedImage image = ImageIO.read(new File(arg));
                          if (image == null) throw new IllegalStateException("ImageIO returned null");
                          image.getRGB(image.getWidth() - 1, image.getHeight() - 1);
                          int cell = image.getWidth() / 9;
                          if (image.getWidth() % 9 != 0 || image.getHeight() != cell) throw new IllegalStateException("invalid atlas geometry");
                          System.out.println("VALID " + arg + " => " + image.getWidth() + "x" + image.getHeight() + " cell=" + cell);
                      } catch (Throwable t) {
                          failures++;
                          System.out.println("INVALID " + arg + " => " + t);
                      }
                  }
                  if (failures != 0) throw new IllegalStateException(failures + " glyph row(s) invalid");
              }
          }
          JAVA
          javac --release 21 /tmp/ns-glyph-repair/ValidateGlyphRows.java
          java -cp /tmp/ns-glyph-repair ValidateGlyphRows /tmp/ns-glyph-repair/row0.png /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row2.png /tmp/ns-glyph-repair/row3.png
