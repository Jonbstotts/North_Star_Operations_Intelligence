name: Finish company dashboard glyph repair
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-finish-company-glyph-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and validate supplied company glyph rows
        shell: bash
        run: |
          set -euo pipefail
          TMPBR=tmp-glyph-repair-diagnostic
          ROW3=34ebff84841cf8387033c86c77fd2cd9abe0c4b9
          mkdir -p /tmp/ns-glyph-repair
          git fetch origin "$TMPBR:refs/remotes/origin/$TMPBR"

          : > /tmp/ns-glyph-repair/row1.b64
          for part in 0 1 2; do
            git show "origin/$TMPBR:tmp/glyph_repair/row1.part${part}.b64" >> /tmp/ns-glyph-repair/row1.b64
          done
          : > /tmp/ns-glyph-repair/row3.b64
          git show "$ROW3:resources/glyphs/staging/row3.b64.00" >> /tmp/ns-glyph-repair/row3.b64
          git show "$ROW3:resources/glyphs/staging/row3.b64.01" >> /tmp/ns-glyph-repair/row3.b64

          tr -d '\r\n ' < /tmp/ns-glyph-repair/row1.b64 | base64 -d > /tmp/ns-glyph-repair/row1.png
          tr -d '\r\n ' < /tmp/ns-glyph-repair/row3.b64 | base64 -d > /tmp/ns-glyph-repair/row3.png
          sha256sum /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png
          file /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png

          cat > /tmp/ns-glyph-repair/ValidateGlyphRows.java <<'JAVA'
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.File;
          public final class ValidateGlyphRows {
              public static void main(String[] args) throws Exception {
                  for (String arg : args) {
                      BufferedImage image = ImageIO.read(new File(arg));
                      if (image == null) throw new IllegalStateException("ImageIO could not decode " + arg);
                      image.getRGB(image.getWidth() - 1, image.getHeight() - 1);
                      if (image.getWidth() % 9 != 0) throw new IllegalStateException("Atlas width is not divisible by 9: " + image.getWidth());
                      int cell = image.getWidth() / 9;
                      if (image.getHeight() != cell) throw new IllegalStateException("Atlas cells are not square: " + image.getWidth() + "x" + image.getHeight());
                      System.out.println(arg + " => " + image.getWidth() + "x" + image.getHeight() + " cell=" + cell);
                  }
              }
          }
          JAVA
          javac --release 21 /tmp/ns-glyph-repair/ValidateGlyphRows.java
          java -cp /tmp/ns-glyph-repair ValidateGlyphRows /tmp/ns-glyph-repair/row1.png /tmp/ns-glyph-repair/row3.png

          cp /tmp/ns-glyph-repair/row1.png resources/glyphs/northstar_dashboard_row1.png
          cp /tmp/ns-glyph-repair/row3.png resources/glyphs/northstar_dashboard_row3.png
          python3 ci/patch_build_glyph_smoke.py
          bash build.sh
          git diff --check
      - name: Commit validated company glyph repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add resources/glyphs/northstar_dashboard_row1.png resources/glyphs/northstar_dashboard_row3.png build.sh
          git diff --cached --check
          git commit -m 'Repair supplied company glyph atlas and gate release builds'
          git push origin master
