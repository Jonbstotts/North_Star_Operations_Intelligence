name: Build NorthStar v2.1.34 GUI RC7
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-rc7-artifact.yml'
permissions:
  contents: read
jobs:
  build-rc7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify RC7
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          # The exact supplied company glyph repair is a hard RC7 release gate.
          echo '111ad93079fb333e6d081c04f1d5c6190694a71494ebafa60ed7e150a40b0647  resources/glyphs/northstar_dashboard_row1.png' | sha256sum -c -
          echo 'de8556a2eddbba94888c3de722127bf9b2bbfeb69a46ad9cf70367e32af11962  resources/glyphs/northstar_dashboard_row3.png' | sha256sum -c -

          bash build.sh
          cp NorthStarOperations.jar NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar
          sha256sum NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar > NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7-SHA256SUMS.txt

          unzip -tq NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar >/dev/null
          unzip -p NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'
          for row in 0 1 2 3; do
            jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar | grep -Fxq "glyphs/northstar_dashboard_row${row}.png"
          done
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar | grep -Fxq 'com/wtm/ui/NorthStarDashboardGlyphs.class'
          jar tf NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar | grep -Fxq 'brand/northstar_primary_logo_exact.png'

          echo "RC7_SOURCE_COMMIT=${GITHUB_SHA}" > NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7-BUILDINFO.txt
          cat NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC7
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7.jar
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7-SHA256SUMS.txt
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC7-BUILDINFO.txt
          if-no-files-found: error
