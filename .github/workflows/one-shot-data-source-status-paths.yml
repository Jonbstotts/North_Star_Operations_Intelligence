name: One-shot Data Collection source status paths

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-data-source-status-paths.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconcile Data Collection status paths with canonical stores
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/com/wtm/ingest/DataIngestionService.java')
          s=p.read_text()
          old=' public Path dataFile(Type t){return operational.resolve(t.name().toLowerCase(Locale.ROOT)+".csv");}\n'
          new=''' public Path dataFile(Type t){\n  if(t==Type.DEALER_NETWORK)return app.resolve("tracking").resolve("logistics-network.csv");\n  if(t==Type.TRACKER_TELEMETRY)return app.resolve("tracking").resolve("tracker-telemetry.csv");\n  return operational.resolve(t.name().toLowerCase(Locale.ROOT)+".csv");\n }\n'''
          if s.count(old)!=1: raise SystemExit('DataIngestionService dataFile anchor mismatch')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq 'if(t==Type.DEALER_NETWORK)return app.resolve("tracking").resolve("logistics-network.csv")' src/com/wtm/ingest/DataIngestionService.java
          grep -Fq 'if(t==Type.TRACKER_TELEMETRY)return app.resolve("tracking").resolve("tracker-telemetry.csv")' src/com/wtm/ingest/DataIngestionService.java
          git diff --check
          rm -rf /tmp/ns-out && mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit Data Collection status fix
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ingest/DataIngestionService.java
          git commit -m 'Align Data Collection status with canonical store paths'
          git push origin master
