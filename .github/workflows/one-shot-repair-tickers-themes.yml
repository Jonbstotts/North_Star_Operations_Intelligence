name: Repair ticker geometry and theme ownership

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-repair-tickers-themes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply foundational ticker and theme repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp/repair_ticker_theme.py
          test -f src/com/wtm/ui/ContinuousTickerGeometry.java
          test -f ci/TickerGeometrySmokeTest.java
          ! grep -Fq 'informationTickerTrack.add(Box.createHorizontalStrut' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -Fq 'operationsTickerTrack.add(Box.createHorizontalStrut' src/com/wtm/ui/OperationsWorkspaceFrame.java
          grep -Fq 'UIManager.getLookAndFeelDefaults()' src/com/wtm/ui/ThemeManager.java
          git diff --check

      - name: Build canonical source
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/com/wtm/ui/ThemeManager.java \
            src/com/wtm/ui/SettingsDialog.java \
            src/com/wtm/ui/OperationsWorkspaceFrame.java \
            src/com/wtm/ui/ContinuousTickerGeometry.java \
            ci/ThemeSmokeTest.java \
            ci/ConfigRoundTripSmokeTest.java \
            ci/TickerGeometrySmokeTest.java \
            build.sh
          git diff --cached --check
          git commit -m 'Make dashboard tickers seamless and isolate theme overlays'
          git push origin HEAD:master
