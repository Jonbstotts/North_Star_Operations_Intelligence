name: One-shot final compatibility prune

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-final-compatibility-prune.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove unused compatibility APIs and stale version comments
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          theme=Path('src/com/wtm/ui/Theme.java')
          s=theme.read_text()
          overloads='''    // Compatibility overloads retained for older components/source extensions.\n    public static Color bg(boolean dark){return dark?AppTheme.DARK.bg():AppTheme.LIGHT.bg();}\n    public static Color panel(boolean dark){return dark?AppTheme.DARK.panel():AppTheme.LIGHT.panel();}\n    public static Color panel2(boolean dark){return dark?AppTheme.DARK.panel2():AppTheme.LIGHT.panel2();}\n    public static Color border(boolean dark){return dark?AppTheme.DARK.border():AppTheme.LIGHT.border();}\n    public static Color text(boolean dark){return dark?AppTheme.DARK.text():AppTheme.LIGHT.text();}\n    public static Color muted(boolean dark){return dark?AppTheme.DARK.muted():AppTheme.LIGHT.muted();}\n\n'''
          if s.count(overloads)!=1:
              raise SystemExit('Theme compatibility overload anchor mismatch')
          # Remove first; javac below is the authoritative reference check.
          theme.write_text(s.replace(overloads,''))

          playback=Path('src/com/wtm/truck/TruckPlaybackService.java')
          s=playback.read_text()
          old='''    /** Compatibility with v1.5.2 callers. */\n    public synchronized void set(\n            TruckShipment source,\n            Location origin,\n            Location destination,\n            int progress,\n            boolean enabled\n    ){\n        if(!enabled){clear();return;}\n        setStraightFallback(\n                source,origin,destination,progress,"Legacy playback");\n    }\n\n'''
          if s.count(old)!=1:
              raise SystemExit('TruckPlayback compatibility method anchor mismatch')
          playback.write_text(s.replace(old,''))

          replacements={
            'src/com/wtm/ui/AddUserDialog.java':[
              ('This replaces the native JOptionPane used in v3.1.0 so account-management',
               'This replaces the native JOptionPane so account-management')],
            'src/com/wtm/ui/SettingsDialog.java':[
              ('         * v1.0.8: The unified Workspace Setup embeds this panel in a larger',
               '         * The unified Workspace Setup embeds this panel in a larger')],
            'src/com/wtm/ui/NorthStarLoginField.java':[
              ('         * v3.2.1 installed BasicTextFieldUI for both field types; that delegate',
               '         * BasicTextFieldUI was previously installed for both field types; that delegate')],
            'src/com/wtm/ui/OperationsWorkspaceFrame.java':[
              ('         * v1.0.7: Information Blocks and the former Operations Workspace page',
               '         * Information Blocks and the former Operations Workspace page')],
            'src/com/wtm/model/OperationsKpiConfig.java':[
              ('This also repairs legacy profiles that accidentally saved',
               'This also repairs older profiles that accidentally saved')],
            'src/com/wtm/app/Main.java':[
              ('                         * v3.1+ is backward-compatible with the former shared',
               '                         * Named-account authentication remains compatible with the former shared')]
          }
          for name,pairs in replacements.items():
              p=Path(name); text=p.read_text()
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'comment anchor missing in {name}: {old}')
                  text=text.replace(old,new)
              p.write_text(text)

          build=Path('build.sh')
          s=build.read_text()
          anchor='''# Dead compatibility-only UI/sports shims must not return.\n'''
          gate='''# Retired Theme boolean overloads and legacy TruckPlayback set(...) API must not return.\nif grep -Fq 'public static Color bg(boolean dark)' src/com/wtm/ui/Theme.java || \\
   grep -Fq 'Compatibility with v1.5.2 callers' src/com/wtm/truck/TruckPlaybackService.java; then\n  echo "ERROR: retired compatibility API returned." >&2\n  exit 1\nfi\n\n'''+anchor
          if s.count(anchor)!=1:
              raise SystemExit('build gate anchor mismatch')
          build.write_text(s.replace(anchor,gate))
          PY
          git diff --check
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -Xlint:unchecked -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit final compatibility prune
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/Theme.java \
                  src/com/wtm/truck/TruckPlaybackService.java \
                  src/com/wtm/ui/AddUserDialog.java \
                  src/com/wtm/ui/SettingsDialog.java \
                  src/com/wtm/ui/NorthStarLoginField.java \
                  src/com/wtm/ui/OperationsWorkspaceFrame.java \
                  src/com/wtm/model/OperationsKpiConfig.java \
                  src/com/wtm/app/Main.java \
                  build.sh
          git commit -m 'Prune final unused compatibility APIs'
          git push origin master
