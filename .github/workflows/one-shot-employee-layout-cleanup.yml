name: One-shot Employee layout ownership cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-employee-layout-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Move Employee split layout into EmployeeOperationsPanel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          employee=Path('src/com/wtm/ui/EmployeeOperationsPanel.java')
          text=employee.read_text(encoding='utf-8')
          old='''        JSplitPane split=new JSplitPane(\n                JSplitPane.HORIZONTAL_SPLIT,\n                buildEmployeeDirectory(),\n                buildEmployeeWorkspace()\n        );\n        split.setResizeWeight(.26);\n        split.setDividerLocation(300);\n        split.setBorder(null);\n        add(split,BorderLayout.CENTER);'''
          new='''        JComponent directory=buildEmployeeDirectory();\n        directory.setMinimumSize(new Dimension(390,0));\n        directory.setPreferredSize(new Dimension(500,1));\n\n        JPanel directoryColumn=new JPanel(new BorderLayout());\n        directoryColumn.setOpaque(false);\n        directoryColumn.setBorder(new EmptyBorder(0,0,0,18));\n        directoryColumn.setMinimumSize(new Dimension(390,0));\n        directoryColumn.setPreferredSize(new Dimension(500,1));\n        directoryColumn.add(directory,BorderLayout.CENTER);\n\n        JSplitPane split=new JSplitPane(\n                JSplitPane.HORIZONTAL_SPLIT,\n                directoryColumn,\n                buildEmployeeWorkspace()\n        );\n        split.setResizeWeight(0.0);\n        split.setDividerSize(0);\n        split.setContinuousLayout(true);\n        split.setOpaque(false);\n        split.setDividerLocation(500);\n        split.setLastDividerLocation(500);\n        split.setBorder(null);\n        add(split,BorderLayout.CENTER);'''
          if text.count(old)!=1:
              raise SystemExit(f'Employee split anchor mismatch: {text.count(old)}')
          employee.write_text(text.replace(old,new,1),encoding='utf-8')

          polish=Path('src/com/wtm/ui/UiFinalPolish.java')
          text=polish.read_text(encoding='utf-8')
          text=text.replace('    private static final String EMPLOYEE_CLASS="com.wtm.ui.EmployeeOperationsPanel";\n\n','')
          text=text.replace('        polishEmployeeLayout(component,false);\n','')
          start=text.find('    private static void polishEmployeeLayout(')
          end=text.find('    private static void polishAppearanceScroll(',start)
          if start<0 or end<0:
              raise SystemExit('Employee polish helper block not found')
          polish.write_text(text[:start]+text[end:],encoding='utf-8')
          PY
          git diff --check
          ! grep -q 'polishEmployeeLayout' src/com/wtm/ui/UiFinalPolish.java
          ! grep -q 'EMPLOYEE_CLASS' src/com/wtm/ui/UiFinalPolish.java
          grep -q 'directoryColumn' src/com/wtm/ui/EmployeeOperationsPanel.java
          grep -q 'split.setDividerLocation(500)' src/com/wtm/ui/EmployeeOperationsPanel.java
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-employee-layout $(find src -name '*.java')
          git diff -- src/com/wtm/ui/EmployeeOperationsPanel.java src/com/wtm/ui/UiFinalPolish.java
      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/EmployeeOperationsPanel.java src/com/wtm/ui/UiFinalPolish.java
          git commit -m 'Move Employee layout ownership into canonical panel'
          git push origin HEAD:master
