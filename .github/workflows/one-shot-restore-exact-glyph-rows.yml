name: Restore exact NorthStar glyph rows
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-restore-exact-glyph-rows.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct exact supplied glyph rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ns-exact-glyphs

          # Row 1 is the previously validated 648x72 recovery made from the
          # original supplied NorthStar artwork.
          git fetch origin tmp-glyph-repair-diagnostic:refs/remotes/origin/tmp-glyph-repair-diagnostic
          for part in 0 1 2; do
            git show "origin/tmp-glyph-repair-diagnostic:tmp/glyph_repair/row1.part${part}.b64" >> /tmp/ns-exact-glyphs/row1.b64
          done
          tr -d '\r\n ' < /tmp/ns-exact-glyphs/row1.b64 | base64 -d > /tmp/ns-exact-glyphs/row1.png

          # Row 3 is cropped directly from the original 1536x1024 PNG supplied
          # in chat on 2026-08-31, with nine source badges preserved in order.
          cat tmp/glyph_source_restore/row3.part00.b64 \
              tmp/glyph_source_restore/row3.part01.b64 \
              tmp/glyph_source_restore/row3.part02.b64 \
              tmp/glyph_source_restore/row3.part03.b64 \
              | tr -d '\r\n ' | base64 -d > /tmp/ns-exact-glyphs/row3.png

          echo '111ad93079fb333e6d081c04f1d5c6190694a71494ebafa60ed7e150a40b0647  /tmp/ns-exact-glyphs/row1.png' | sha256sum -c -
          echo 'de8556a2eddbba94888c3de722127bf9b2bbfeb69a46ad9cf70367e32af11962  /tmp/ns-exact-glyphs/row3.png' | sha256sum -c -

          cat > /tmp/ns-exact-glyphs/Validate.java <<'JAVA'
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.File;
          public final class Validate {
            public static void main(String[] args) throws Exception {
              for (String arg : args) {
                BufferedImage image = ImageIO.read(new File(arg));
                if (image == null) throw new IllegalStateException("ImageIO returned null: " + arg);
                image.getRGB(image.getWidth()-1, image.getHeight()-1);
                if (image.getWidth() != 648 || image.getHeight() != 72 || image.getWidth()/9 != image.getHeight())
                  throw new IllegalStateException("Invalid atlas geometry: " + arg + " => " + image.getWidth() + "x" + image.getHeight());
                System.out.println("VALID " + arg + " => " + image.getWidth() + "x" + image.getHeight());
              }
            }
          }
          JAVA
          javac --release 21 /tmp/ns-exact-glyphs/Validate.java
          java -cp /tmp/ns-exact-glyphs Validate /tmp/ns-exact-glyphs/row1.png /tmp/ns-exact-glyphs/row3.png

          cp /tmp/ns-exact-glyphs/row1.png resources/glyphs/northstar_dashboard_row1.png
          cp /tmp/ns-exact-glyphs/row3.png resources/glyphs/northstar_dashboard_row3.png
          git diff --check
          bash build.sh
      - name: Commit repaired exact glyph atlases and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add resources/glyphs/northstar_dashboard_row1.png resources/glyphs/northstar_dashboard_row3.png
          git rm -f tmp/glyph_source_restore/*.b64
          git rm -f .github/workflows/one-shot-restore-exact-glyph-rows.yml
          git diff --cached --check
          git commit -m 'Restore exact supplied NorthStar dashboard glyph rows'
          git push origin master
