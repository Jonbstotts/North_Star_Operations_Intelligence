name: Build NorthStar GUI RC12

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc12.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC12 source
        uses: actions/checkout@v4
        with:
          ref: 8ae2d87b60d397b80b5d0a7e93d0041b411816dc
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC12
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8ae2d87b60d397b80b5d0a7e93d0041b411816dc"
          test -f src/com/wtm/map/BasemapProvider.java
          grep -Fq 'BasemapProvider.fromId(config.basemapProvider)' src/com/wtm/map/TileMapPanel.java
          grep -Fq 'https://tile.openstreetmap.org/' src/com/wtm/map/BasemapProvider.java
          ! grep -R -q --include='*.java' 'basemaps\.cartocdn\.com' src
          grep -Fq 'resolve("cache").resolve("map-v2")' src/com/wtm/map/TileMapPanel.java
          grep -Fq 'Basemap provider' src/com/wtm/ui/SettingsDialog.java

          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'

          for entry in \
            com/wtm/map/BasemapProvider.class \
            com/wtm/map/TileMapPanel.class \
            com/wtm/config/AppConfig.class \
            com/wtm/config/ConfigService.class \
            com/wtm/ui/SettingsDialog.class \
            com/wtm/ui/OperationsWorkspaceFrame.class \
            com/wtm/ui/OperationsAnnouncementSlidePanel.class \
            com/wtm/alerts/WeatherAlertPolicy.class \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done

          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC12.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC12-SHA256SUMS.txt
          printf 'RC12_SOURCE_SHA=%s\nRC12_JAR=%s\nBASEMAP_PROVIDER=OPENSTREETMAP\n' \
            "$(git rev-parse HEAD)" "$OUT" | tee NorthStar-v2.1.34-GUI-RC12-BUILDINFO.txt

      - name: Upload RC12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC12
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC12.jar
            NorthStar-v2.1.34-GUI-RC12-SHA256SUMS.txt
            NorthStar-v2.1.34-GUI-RC12-BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30
