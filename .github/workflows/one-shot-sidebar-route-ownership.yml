name: One-shot sidebar route ownership cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-sidebar-route-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Make sidebar route identity explicit at construction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frame=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          text=frame.read_text(encoding='utf-8')
          old='''        button.setFocusPainted(false);\n        button.setBorder(new EmptyBorder(9,12,9,12));'''
          new='''        button.setFocusPainted(false);\n        button.putClientProperty("northstar.sidebar.route",Boolean.TRUE);\n        button.setBorder(new EmptyBorder(9,12,9,12));'''
          if text.count(old)!=1:
              raise SystemExit(f'createSidebarButton anchor mismatch: {text.count(old)}')
          text=text.replace(old,new,1)
          duplicate='''        button.putClientProperty("northstar.sidebar.route",Boolean.TRUE);\n        button.putClientProperty("northstar.ui.skip",Boolean.TRUE);'''
          replacement='''        button.putClientProperty("northstar.ui.skip",Boolean.TRUE);'''
          if text.count(duplicate)!=1:
              raise SystemExit(f'extension route duplicate marker mismatch: {text.count(duplicate)}')
          frame.write_text(text.replace(duplicate,replacement,1),encoding='utf-8')

          styler=Path('src/com/wtm/ui/ThemeStyler.java')
          text=styler.read_text(encoding='utf-8')
          text=text.replace('import java.util.Locale;\n','')
          old='''    private static boolean isSidebarRouteButton(JButton button){\n        if(Boolean.TRUE.equals(button.getClientProperty("northstar.sidebar.route")))return true;\n        String className=button.getClass().getName();\n        if(className.contains("OperationsWorkspaceFrame$RoundedSidebarButton"))return true;\n        String text=button.getText();\n        if(text==null)return false;\n        String normalized=text.replaceAll("\\\\s+"," ").trim().toLowerCase(Locale.ROOT);\n        return normalized.contains("data collection")\n                ||normalized.contains("northstar intelligence");\n    }'''
          new='''    private static boolean isSidebarRouteButton(JButton button){\n        return Boolean.TRUE.equals(button.getClientProperty("northstar.sidebar.route"));\n    }'''
          if text.count(old)!=1:
              raise SystemExit(f'ThemeStyler route matcher anchor mismatch: {text.count(old)}')
          styler.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          grep -q 'button.putClientProperty("northstar.sidebar.route",Boolean.TRUE)' src/com/wtm/ui/OperationsWorkspaceFrame.java
          ! grep -q 'getClass().getName' src/com/wtm/ui/ThemeStyler.java
          ! grep -qi 'data collection' src/com/wtm/ui/ThemeStyler.java
          ! grep -qi 'northstar intelligence' src/com/wtm/ui/ThemeStyler.java
          ! grep -q 'java.util.Locale' src/com/wtm/ui/ThemeStyler.java
          rm -rf /tmp/northstar-sidebar-route
          mkdir -p /tmp/northstar-sidebar-route
          javac --release 21 -encoding UTF-8 -d /tmp/northstar-sidebar-route $(find src -name '*.java')
          bash build.sh
          unzip -tq NorthStarOperations.jar >/dev/null
      - name: Commit explicit sidebar route ownership
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/ui/ThemeStyler.java
          git commit -m 'Make sidebar route identity source-owned'
          git push origin HEAD:master
