name: Build NorthStar GUI RC8

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-build-rc8.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fixed RC8 source
        uses: actions/checkout@v4
        with:
          ref: ca23b6c3e6c7d4959d0fe2580a9bd4f6abf3c88a
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and validate RC8
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ca23b6c3e6c7d4959d0fe2580a9bd4f6abf3c88a"
          bash build.sh
          test -f NorthStarOperations.jar
          unzip -tq NorthStarOperations.jar >/dev/null
          DUPLICATES=$(zipinfo -1 NorthStarOperations.jar | sort | uniq -d | wc -l | tr -d ' ')
          test "$DUPLICATES" = "0"
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Main-Class: com.wtm.app.NorthStarMainStable'
          unzip -p NorthStarOperations.jar META-INF/MANIFEST.MF | grep -q '^Implementation-Version: 2.1.34-clean-sweep'
          for entry in \
            glyphs/northstar_dashboard_row0.png \
            glyphs/northstar_dashboard_row1.png \
            glyphs/northstar_dashboard_row2.png \
            glyphs/northstar_dashboard_row3.png \
            com/wtm/ui/NorthStarDashboardGlyphs.class \
            com/wtm/ui/DashboardGridPanel.class \
            com/wtm/config/ConfigService.class; do
            jar tf NorthStarOperations.jar | grep -Fxq "$entry"
          done
          OUT='NorthStar-Operations-Intelligence-v2.1.34-GUI-RC8.jar'
          cp NorthStarOperations.jar "$OUT"
          sha256sum "$OUT" | tee NorthStar-v2.1.34-GUI-RC8-SHA256SUMS.txt
          echo "RC8_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "RC8_JAR=$OUT"

      - name: Upload RC8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthStar-v2.1.34-GUI-RC8
          path: |
            NorthStar-Operations-Intelligence-v2.1.34-GUI-RC8.jar
            NorthStar-v2.1.34-GUI-RC8-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
