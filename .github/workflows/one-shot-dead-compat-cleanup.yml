name: One-shot dead compatibility cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/one-shot-dead-compat-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remove dead compatibility-only code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frame=Path('src/com/wtm/ui/OperationsWorkspaceFrame.java')
          s=frame.read_text()
          old='''        int slotWidthLegacy=Math.max(\n                165,\n                Math.max(1,card.getWidth())/workspaceMetricColumnCount()\n        );\n        // slotWidthLegacy is retained only for source compatibility/documentation.\n        // The unified visible-at-once setting above controls actual ticker slot width.\n\n'''
          if s.count(old)!=1:
              raise SystemExit('slotWidthLegacy anchor mismatch')
          frame.write_text(s.replace(old,''))

          sports=Path('src/com/wtm/sports/TheSportsDbService.java')
          s=sports.read_text()
          old='''    /**\n     * Retained for source compatibility with older integrations. The first\n     * upcoming event is returned; live/recent results are no longer preferred.\n     */\n    public SportsGame fetch(\n            SportsConfig cfg,\n            String configuredKey,\n            boolean premium\n    ) throws Exception {\n        List<SportsGame> upcoming=fetchUpcoming(cfg,configuredKey,1);\n        return upcoming.isEmpty()?unavailable(cfg,false):upcoming.get(0);\n    }\n\n'''
          # Canonical code uses fetchUpcoming(); no exact sportsService.fetch(...) call remains.
          refs=[]
          for p in Path('src').rglob('*.java'):
              if p==sports:
                  continue
              text=p.read_text()
              if 'sportsService.fetch(' in text or 'new TheSportsDbService' in text and '.fetch(' in text:
                  refs.append(str(p))
          if refs:
              raise SystemExit('TheSportsDbService.fetch compatibility API still has refs: '+', '.join(refs))
          if s.count(old)!=1:
              raise SystemExit('sports compatibility fetch anchor mismatch')
          sports.write_text(s.replace(old,''))

          build=Path('build.sh')
          s=build.read_text()
          anchor='''# Redundant workspace movement compatibility state and stale preview markers\n# must not return to canonical source.\n'''
          gate='''# Dead compatibility-only UI/sports shims must not return.\nif grep -R -n --include='*.java' -E 'slotWidthLegacy|Retained for source compatibility with older integrations' src; then\n  echo "ERROR: dead compatibility-only code returned." >&2\n  exit 1\nfi\n\n'''+anchor
          if s.count(anchor)!=1:
              raise SystemExit('build.sh compatibility gate anchor mismatch')
          build.write_text(s.replace(anchor,gate))
          PY
          git diff --check
          rm -rf /tmp/ns-out
          mkdir -p /tmp/ns-out
          javac --release 21 -encoding UTF-8 -d /tmp/ns-out $(find src -name '*.java')
          bash build.sh
      - name: Commit dead compatibility cleanup
        run: |
          set -euo pipefail
          git config user.name 'NorthStar Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/wtm/ui/OperationsWorkspaceFrame.java src/com/wtm/sports/TheSportsDbService.java build.sh
          git commit -m 'Remove dead compatibility-only UI and sports shims'
          git push origin master
